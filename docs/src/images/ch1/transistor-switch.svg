<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" font-family="system-ui, -apple-system, sans-serif">
  <rect width="640" height="280" fill="#1a1a2e"/>

  <!-- === ON state (left) === -->
  <text x="160" y="28" text-anchor="middle" fill="#81c784" font-size="14" font-weight="bold">Control = HIGH (1)</text>

  <!-- Switch body ON -->
  <rect x="90" y="80" width="140" height="120" rx="10" fill="#1a2e1a" stroke="#81c784" stroke-width="2"/>

  <!-- Input terminal -->
  <line x1="50" y1="120" x2="90" y2="120" stroke="#e0e0e0" stroke-width="2.5"/>
  <text x="40" y="124" text-anchor="end" fill="#e0e0e0" font-size="12" font-weight="bold">In</text>
  <circle cx="90" cy="120" r="4" fill="#81c784"/>

  <!-- Output terminal -->
  <line x1="230" y1="120" x2="270" y2="120" stroke="#e0e0e0" stroke-width="2.5"/>
  <text x="280" y="124" fill="#e0e0e0" font-size="12" font-weight="bold">Out</text>
  <circle cx="230" cy="120" r="4" fill="#81c784"/>

  <!-- Switch closed (connected line) -->
  <line x1="105" y1="120" x2="215" y2="120" stroke="#81c784" stroke-width="3"/>

  <!-- Control terminal -->
  <line x1="160" y1="200" x2="160" y2="230" stroke="#e0e0e0" stroke-width="2.5"/>
  <text x="160" y="250" text-anchor="middle" fill="#e0e0e0" font-size="12" font-weight="bold">Control</text>
  <circle cx="160" cy="200" r="4" fill="#81c784"/>

  <!-- Flow arrow -->
  <text x="160" y="150" text-anchor="middle" fill="#81c784" font-size="11">Current flows</text>
  <line x1="120" y1="105" x2="200" y2="105" stroke="#fff176" stroke-width="1.5" marker-end="url(#arrY)"/>

  <!-- === OFF state (right) === -->
  <text x="480" y="28" text-anchor="middle" fill="#ef5350" font-size="14" font-weight="bold">Control = LOW (0)</text>

  <!-- Switch body OFF -->
  <rect x="410" y="80" width="140" height="120" rx="10" fill="#2a1a1a" stroke="#ef5350" stroke-width="2"/>

  <!-- Input terminal -->
  <line x1="370" y1="120" x2="410" y2="120" stroke="#e0e0e0" stroke-width="2.5"/>
  <text x="360" y="124" text-anchor="end" fill="#e0e0e0" font-size="12" font-weight="bold">In</text>
  <circle cx="410" cy="120" r="4" fill="#ef5350"/>

  <!-- Output terminal -->
  <line x1="550" y1="120" x2="590" y2="120" stroke="#e0e0e0" stroke-width="2.5"/>
  <text x="600" y="124" fill="#e0e0e0" font-size="12" font-weight="bold">Out</text>
  <circle cx="550" cy="120" r="4" fill="#ef5350"/>

  <!-- Switch open (gap) -->
  <line x1="425" y1="120" x2="465" y2="120" stroke="#ef5350" stroke-width="3"/>
  <line x1="495" y1="120" x2="535" y2="120" stroke="#ef5350" stroke-width="3"/>
  <line x1="465" y1="120" x2="480" y2="100" stroke="#ef5350" stroke-width="3"/>

  <!-- Control terminal -->
  <line x1="480" y1="200" x2="480" y2="230" stroke="#e0e0e0" stroke-width="2.5"/>
  <text x="480" y="250" text-anchor="middle" fill="#e0e0e0" font-size="12" font-weight="bold">Control</text>
  <circle cx="480" cy="200" r="4" fill="#ef5350"/>

  <!-- No flow label -->
  <text x="480" y="150" text-anchor="middle" fill="#ef5350" font-size="11">No current</text>

  <defs>
    <marker id="arrY" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#fff176"/>
    </marker>
  </defs>

  <text x="320" y="275" text-anchor="middle" fill="#5c6370" font-size="10">A transistor is just a switch: ON or OFF, 1 or 0.</text>
</svg>
