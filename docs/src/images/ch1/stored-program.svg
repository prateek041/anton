<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" font-family="system-ui, -apple-system, sans-serif">
  <rect width="400" height="440" fill="#1a1a2e"/>

  <text x="200" y="28" text-anchor="middle" fill="#e0e0e0" font-size="14" font-weight="bold">Memory: Instructions and Data Together</text>

  <!-- Column header -->
  <text x="70" y="58" text-anchor="middle" fill="#8e99a4" font-size="11">Address</text>
  <text x="200" y="58" text-anchor="middle" fill="#8e99a4" font-size="11">Contents</text>
  <text x="330" y="58" text-anchor="middle" fill="#8e99a4" font-size="11">Type</text>

  <!-- Row 0: Instruction -->
  <rect x="110" y="68" width="180" height="34" rx="4" fill="#1b2a3a" stroke="#4fc3f7" stroke-width="1.5"/>
  <text x="70" y="90" text-anchor="middle" fill="#e0e0e0" font-size="12" font-family="monospace">0x00</text>
  <text x="200" y="90" text-anchor="middle" fill="#4fc3f7" font-size="12" font-family="monospace">MOV EAX, 5</text>
  <text x="330" y="90" text-anchor="middle" fill="#4fc3f7" font-size="10">Instruction</text>

  <!-- Row 1: Instruction -->
  <rect x="110" y="108" width="180" height="34" rx="4" fill="#1b2a3a" stroke="#4fc3f7" stroke-width="1.5"/>
  <text x="70" y="130" text-anchor="middle" fill="#e0e0e0" font-size="12" font-family="monospace">0x05</text>
  <text x="200" y="130" text-anchor="middle" fill="#4fc3f7" font-size="12" font-family="monospace">ADD EAX, EBX</text>
  <text x="330" y="130" text-anchor="middle" fill="#4fc3f7" font-size="10">Instruction</text>

  <!-- Row 2: Data -->
  <rect x="110" y="148" width="180" height="34" rx="4" fill="#1a2e1a" stroke="#81c784" stroke-width="1.5"/>
  <text x="70" y="170" text-anchor="middle" fill="#e0e0e0" font-size="12" font-family="monospace">0x07</text>
  <text x="200" y="170" text-anchor="middle" fill="#81c784" font-size="12" font-family="monospace">0x0000002A</text>
  <text x="330" y="170" text-anchor="middle" fill="#81c784" font-size="10">Data (42)</text>

  <!-- Row 3: Instruction -->
  <rect x="110" y="188" width="180" height="34" rx="4" fill="#1b2a3a" stroke="#4fc3f7" stroke-width="1.5"/>
  <text x="70" y="210" text-anchor="middle" fill="#e0e0e0" font-size="12" font-family="monospace">0x0B</text>
  <text x="200" y="210" text-anchor="middle" fill="#4fc3f7" font-size="12" font-family="monospace">MOV [0x20], EAX</text>
  <text x="330" y="210" text-anchor="middle" fill="#4fc3f7" font-size="10">Instruction</text>

  <!-- Row 4: Data -->
  <rect x="110" y="228" width="180" height="34" rx="4" fill="#1a2e1a" stroke="#81c784" stroke-width="1.5"/>
  <text x="70" y="250" text-anchor="middle" fill="#e0e0e0" font-size="12" font-family="monospace">0x10</text>
  <text x="200" y="250" text-anchor="middle" fill="#81c784" font-size="12" font-family="monospace">0x00000007</text>
  <text x="330" y="250" text-anchor="middle" fill="#81c784" font-size="10">Data (7)</text>

  <!-- Row 5: Instruction -->
  <rect x="110" y="268" width="180" height="34" rx="4" fill="#1b2a3a" stroke="#4fc3f7" stroke-width="1.5"/>
  <text x="70" y="290" text-anchor="middle" fill="#e0e0e0" font-size="12" font-family="monospace">0x14</text>
  <text x="200" y="290" text-anchor="middle" fill="#4fc3f7" font-size="12" font-family="monospace">JMP 0x00</text>
  <text x="330" y="290" text-anchor="middle" fill="#4fc3f7" font-size="10">Instruction</text>

  <!-- Row 6: Data -->
  <rect x="110" y="308" width="180" height="34" rx="4" fill="#1a2e1a" stroke="#81c784" stroke-width="1.5"/>
  <text x="70" y="330" text-anchor="middle" fill="#e0e0e0" font-size="12" font-family="monospace">0x16</text>
  <text x="200" y="330" text-anchor="middle" fill="#81c784" font-size="12" font-family="monospace">0x48656C6C</text>
  <text x="330" y="330" text-anchor="middle" fill="#81c784" font-size="10">Data ("Hell")</text>

  <!-- Ellipsis -->
  <text x="200" y="365" text-anchor="middle" fill="#5c6370" font-size="16">...</text>

  <!-- Legend -->
  <rect x="100" y="385" width="14" height="14" rx="2" fill="#1b2a3a" stroke="#4fc3f7" stroke-width="1.5"/>
  <text x="120" y="396" fill="#8e99a4" font-size="11">= Instruction</text>
  <rect x="220" y="385" width="14" height="14" rx="2" fill="#1a2e1a" stroke="#81c784" stroke-width="1.5"/>
  <text x="240" y="396" fill="#8e99a4" font-size="11">= Data</text>

  <text x="200" y="428" text-anchor="middle" fill="#5c6370" font-size="10">The CPU treats them all as numbers. Context determines meaning.</text>
</svg>
