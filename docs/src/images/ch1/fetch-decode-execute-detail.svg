<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="system-ui, -apple-system, sans-serif">
  <rect width="720" height="380" fill="#1a1a2e"/>

  <defs>
    <marker id="fde-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e0e0e0"/>
    </marker>
    <marker id="fde-arr-b" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4fc3f7"/>
    </marker>
    <marker id="fde-arr-g" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#81c784"/>
    </marker>
    <marker id="fde-arr-o" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ffb74d"/>
    </marker>
    <marker id="fde-arr-r" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ef5350"/>
    </marker>
  </defs>

  <text x="360" y="24" text-anchor="middle" fill="#e0e0e0" font-size="14" font-weight="bold">Fetch-Decode-Execute: One Cycle in Detail</text>

  <!-- CPU block -->
  <rect x="30" y="50" width="260" height="240" rx="12" fill="#1a1a2e" stroke="#4fc3f7" stroke-width="2"/>
  <text x="160" y="74" text-anchor="middle" fill="#4fc3f7" font-size="14" font-weight="bold">CPU</text>

  <!-- EIP register inside CPU -->
  <rect x="50" y="88" width="100" height="32" rx="5" fill="#2a1a3a" stroke="#ce93d8" stroke-width="1.5"/>
  <text x="100" y="100" text-anchor="middle" fill="#ce93d8" font-size="10" font-weight="bold">EIP</text>
  <text x="100" y="114" text-anchor="middle" fill="#ce93d8" font-size="9" font-family="monospace">0x00100000</text>

  <!-- Decoder inside CPU -->
  <rect x="50" y="140" width="100" height="32" rx="5" fill="#1a1a2e" stroke="#81c784" stroke-width="1.5"/>
  <text x="100" y="161" text-anchor="middle" fill="#81c784" font-size="10" font-weight="bold">Decoder</text>

  <!-- ALU / Execute inside CPU -->
  <rect x="50" y="192" width="100" height="32" rx="5" fill="#1a1a2e" stroke="#ffb74d" stroke-width="1.5"/>
  <text x="100" y="213" text-anchor="middle" fill="#ffb74d" font-size="10" font-weight="bold">Execute Unit</text>

  <!-- EAX register -->
  <rect x="170" y="140" width="100" height="32" rx="5" fill="#1a1a2e" stroke="#8e99a4" stroke-width="1.5"/>
  <text x="220" y="155" text-anchor="middle" fill="#8e99a4" font-size="9">EAX</text>
  <text x="220" y="167" text-anchor="middle" fill="#fff176" font-size="9" font-family="monospace">= 5</text>

  <!-- Memory block -->
  <rect x="430" y="50" width="250" height="240" rx="12" fill="#1a1a2e" stroke="#81c784" stroke-width="2"/>
  <text x="555" y="74" text-anchor="middle" fill="#81c784" font-size="14" font-weight="bold">Memory</text>

  <!-- Memory cells -->
  <text x="450" y="100" fill="#8e99a4" font-size="9" font-family="monospace">0x00100000</text>
  <rect x="540" y="86" width="120" height="22" rx="3" fill="#2e2a1a" stroke="#fff176" stroke-width="1.5"/>
  <text x="600" y="102" text-anchor="middle" fill="#fff176" font-size="10" font-family="monospace">B8 05 00 00 00</text>

  <text x="450" y="126" fill="#8e99a4" font-size="9" font-family="monospace">0x00100005</text>
  <rect x="540" y="112" width="120" height="22" rx="3" fill="#1a2e1a" stroke="#81c784" stroke-width="1"/>
  <text x="600" y="128" text-anchor="middle" fill="#81c784" font-size="10" font-family="monospace">01 D8</text>

  <text x="450" y="152" fill="#8e99a4" font-size="9" font-family="monospace">0x00100007</text>
  <rect x="540" y="138" width="120" height="22" rx="3" fill="#1a2e1a" stroke="#81c784" stroke-width="1"/>
  <text x="600" y="154" text-anchor="middle" fill="#81c784" font-size="10" font-family="monospace">89 C3</text>

  <!-- Bus bar between CPU and Memory -->
  <rect x="310" y="140" width="100" height="30" rx="4" fill="#2a1a1a" stroke="#ef5350" stroke-width="1.5"/>
  <text x="360" y="160" text-anchor="middle" fill="#ef5350" font-size="9" font-weight="bold">System Bus</text>

  <!-- Step 1 arrow: EIP -> Memory (address) -->
  <path d="M 150,104 L 310,104 L 310,140" stroke="#4fc3f7" stroke-width="1.5" fill="none" marker-end="url(#fde-arr-b)"/>
  <circle cx="160" cy="50" r="12" fill="#4fc3f7"/>
  <text x="160" y="54" text-anchor="middle" fill="#1a1a2e" font-size="10" font-weight="bold">1</text>
  <text x="180" y="54" fill="#4fc3f7" font-size="9">EIP sends address</text>

  <!-- Step 2 arrow: Memory -> CPU (instruction bytes) -->
  <path d="M 430,155 L 390,155 L 390,170 L 310,170" stroke="#81c784" stroke-width="1.5" fill="none" marker-end="url(#fde-arr-g)"/>
  <circle cx="462" cy="200" r="12" fill="#81c784"/>
  <text x="462" y="204" text-anchor="middle" fill="#1a1a2e" font-size="10" font-weight="bold">2</text>
  <text x="480" y="204" fill="#81c784" font-size="9">Memory returns bytes</text>

  <!-- Step 3: Decode -->
  <circle cx="58" cy="246" r="12" fill="#ffb74d"/>
  <text x="58" y="250" text-anchor="middle" fill="#1a1a2e" font-size="10" font-weight="bold">3</text>
  <text x="78" y="250" fill="#ffb74d" font-size="9">CPU decodes: MOV EAX, 5</text>

  <!-- Step 4: Execute + Advance -->
  <circle cx="462" cy="250" r="12" fill="#ef5350"/>
  <text x="462" y="254" text-anchor="middle" fill="#1a1a2e" font-size="10" font-weight="bold">4</text>
  <text x="480" y="254" fill="#ef5350" font-size="9">Execute: EAX = 5</text>
  <text x="480" y="270" fill="#ef5350" font-size="9">Advance: EIP += 5</text>

  <!-- Bottom summary -->
  <text x="360" y="330" text-anchor="middle" fill="#e0e0e0" font-size="12" font-weight="bold">The instruction: MOV EAX, 5 (machine code: B8 05 00 00 00)</text>
  <text x="360" y="350" text-anchor="middle" fill="#8e99a4" font-size="11">After execution: EAX holds 5, EIP advances from 0x00100000 to 0x00100005</text>
  <text x="360" y="370" text-anchor="middle" fill="#8e99a4" font-size="11">Then the cycle repeats with the next instruction (01 D8 = ADD EAX, EBX)</text>
</svg>
