<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" font-family="system-ui, -apple-system, sans-serif">
  <rect width="720" height="480" fill="#1a1a2e"/>

  <!-- ========== NOT Gate ========== -->
  <text x="100" y="30" text-anchor="middle" fill="#4fc3f7" font-size="15" font-weight="bold">NOT</text>

  <!-- NOT symbol: triangle + bubble -->
  <polygon points="40,50 40,110 90,80" fill="none" stroke="#4fc3f7" stroke-width="2"/>
  <circle cx="96" cy="80" r="5" fill="none" stroke="#4fc3f7" stroke-width="2"/>
  <line x1="20" y1="80" x2="40" y2="80" stroke="#e0e0e0" stroke-width="2"/>
  <line x1="101" y1="80" x2="120" y2="80" stroke="#e0e0e0" stroke-width="2"/>
  <text x="14" y="84" text-anchor="end" fill="#e0e0e0" font-size="11">A</text>
  <text x="126" y="84" fill="#e0e0e0" font-size="11">Q</text>

  <!-- NOT truth table -->
  <text x="60" y="136" text-anchor="middle" fill="#8e99a4" font-size="10" font-weight="bold">A</text>
  <text x="100" y="136" text-anchor="middle" fill="#8e99a4" font-size="10" font-weight="bold">Q</text>
  <line x1="35" y1="140" x2="125" y2="140" stroke="#3a3a5a" stroke-width="1"/>
  <text x="60" y="156" text-anchor="middle" fill="#e0e0e0" font-size="10" font-family="monospace">0</text>
  <text x="100" y="156" text-anchor="middle" fill="#81c784" font-size="10" font-family="monospace">1</text>
  <text x="60" y="172" text-anchor="middle" fill="#e0e0e0" font-size="10" font-family="monospace">1</text>
  <text x="100" y="172" text-anchor="middle" fill="#81c784" font-size="10" font-family="monospace">0</text>

  <!-- ========== AND Gate ========== -->
  <text x="280" y="30" text-anchor="middle" fill="#81c784" font-size="15" font-weight="bold">AND</text>

  <!-- AND symbol: flat left + curved right -->
  <path d="M 220,50 L 270,50 Q 310,80 270,110 L 220,110 Z" fill="none" stroke="#81c784" stroke-width="2"/>
  <line x1="200" y1="66" x2="220" y2="66" stroke="#e0e0e0" stroke-width="2"/>
  <line x1="200" y1="94" x2="220" y2="94" stroke="#e0e0e0" stroke-width="2"/>
  <line x1="300" y1="80" x2="320" y2="80" stroke="#e0e0e0" stroke-width="2"/>
  <text x="194" y="70" text-anchor="end" fill="#e0e0e0" font-size="11">A</text>
  <text x="194" y="98" text-anchor="end" fill="#e0e0e0" font-size="11">B</text>
  <text x="326" y="84" fill="#e0e0e0" font-size="11">Q</text>

  <!-- AND truth table -->
  <text x="230" y="136" text-anchor="middle" fill="#8e99a4" font-size="10" font-weight="bold">A</text>
  <text x="260" y="136" text-anchor="middle" fill="#8e99a4" font-size="10" font-weight="bold">B</text>
  <text x="300" y="136" text-anchor="middle" fill="#8e99a4" font-size="10" font-weight="bold">Q</text>
  <line x1="210" y1="140" x2="320" y2="140" stroke="#3a3a5a" stroke-width="1"/>
  <text x="230" y="156" text-anchor="middle" fill="#e0e0e0" font-size="10" font-family="monospace">0</text>
  <text x="260" y="156" text-anchor="middle" fill="#e0e0e0" font-size="10" font-family="monospace">0</text>
  <text x="300" y="156" text-anchor="middle" fill="#81c784" font-size="10" font-family="monospace">0</text>
  <text x="230" y="172" text-anchor="middle" fill="#e0e0e0" font-size="10" font-family="monospace">0</text>
  <text x="260" y="172" text-anchor="middle" fill="#e0e0e0" font-size="10" font-family="monospace">1</text>
  <text x="300" y="172" text-anchor="middle" fill="#81c784" font-size="10" font-family="monospace">0</text>
  <text x="230" y="188" text-anchor="middle" fill="#e0e0e0" font-size="10" font-family="monospace">1</text>
  <text x="260" y="188" text-anchor="middle" fill="#e0e0e0" font-size="10" font-family="monospace">0</text>
  <text x="300" y="188" text-anchor="middle" fill="#81c784" font-size="10" font-family="monospace">0</text>
  <text x="230" y="204" text-anchor="middle" fill="#e0e0e0" font-size="10" font-family="monospace">1</text>
  <text x="260" y="204" text-anchor="middle" fill="#e0e0e0" font-size="10" font-family="monospace">1</text>
  <text x="300" y="204" text-anchor="middle" fill="#fff176" font-size="10" font-family="monospace">1</text>

  <!-- ========== OR Gate ========== -->
  <text x="100" y="260" text-anchor="middle" fill="#ffb74d" font-size="15" font-weight="bold">OR</text>

  <!-- OR symbol: curved left + pointed right -->
  <path d="M 40,280 Q 60,310 40,340 Q 80,340 110,310 Q 80,280 40,280 Z" fill="none" stroke="#ffb74d" stroke-width="2"/>
  <line x1="20" y1="296" x2="52" y2="296" stroke="#e0e0e0" stroke-width="2"/>
  <line x1="20" y1="324" x2="52" y2="324" stroke="#e0e0e0" stroke-width="2"/>
  <line x1="110" y1="310" x2="130" y2="310" stroke="#e0e0e0" stroke-width="2"/>
  <text x="14" y="300" text-anchor="end" fill="#e0e0e0" font-size="11">A</text>
  <text x="14" y="328" text-anchor="end" fill="#e0e0e0" font-size="11">B</text>
  <text x="136" y="314" fill="#e0e0e0" font-size="11">Q</text>

  <!-- OR truth table -->
  <text x="50" y="366" text-anchor="middle" fill="#8e99a4" font-size="10" font-weight="bold">A</text>
  <text x="80" y="366" text-anchor="middle" fill="#8e99a4" font-size="10" font-weight="bold">B</text>
  <text x="120" y="366" text-anchor="middle" fill="#8e99a4" font-size="10" font-weight="bold">Q</text>
  <line x1="30" y1="370" x2="140" y2="370" stroke="#3a3a5a" stroke-width="1"/>
  <text x="50" y="386" text-anchor="middle" fill="#e0e0e0" font-size="10" font-family="monospace">0</text>
  <text x="80" y="386" text-anchor="middle" fill="#e0e0e0" font-size="10" font-family="monospace">0</text>
  <text x="120" y="386" text-anchor="middle" fill="#ffb74d" font-size="10" font-family="monospace">0</text>
  <text x="50" y="402" text-anchor="middle" fill="#e0e0e0" font-size="10" font-family="monospace">0</text>
  <text x="80" y="402" text-anchor="middle" fill="#e0e0e0" font-size="10" font-family="monospace">1</text>
  <text x="120" y="402" text-anchor="middle" fill="#fff176" font-size="10" font-family="monospace">1</text>
  <text x="50" y="418" text-anchor="middle" fill="#e0e0e0" font-size="10" font-family="monospace">1</text>
  <text x="80" y="418" text-anchor="middle" fill="#e0e0e0" font-size="10" font-family="monospace">0</text>
  <text x="120" y="418" text-anchor="middle" fill="#fff176" font-size="10" font-family="monospace">1</text>
  <text x="50" y="434" text-anchor="middle" fill="#e0e0e0" font-size="10" font-family="monospace">1</text>
  <text x="80" y="434" text-anchor="middle" fill="#e0e0e0" font-size="10" font-family="monospace">1</text>
  <text x="120" y="434" text-anchor="middle" fill="#fff176" font-size="10" font-family="monospace">1</text>

  <!-- ========== XOR Gate ========== -->
  <text x="280" y="260" text-anchor="middle" fill="#ce93d8" font-size="15" font-weight="bold">XOR</text>

  <!-- XOR symbol: OR shape + extra curve -->
  <path d="M 220,280 Q 240,310 220,340 Q 260,340 290,310 Q 260,280 220,280 Z" fill="none" stroke="#ce93d8" stroke-width="2"/>
  <path d="M 214,280 Q 234,310 214,340" fill="none" stroke="#ce93d8" stroke-width="2"/>
  <line x1="200" y1="296" x2="232" y2="296" stroke="#e0e0e0" stroke-width="2"/>
  <line x1="200" y1="324" x2="232" y2="324" stroke="#e0e0e0" stroke-width="2"/>
  <line x1="290" y1="310" x2="310" y2="310" stroke="#e0e0e0" stroke-width="2"/>
  <text x="194" y="300" text-anchor="end" fill="#e0e0e0" font-size="11">A</text>
  <text x="194" y="328" text-anchor="end" fill="#e0e0e0" font-size="11">B</text>
  <text x="316" y="314" fill="#e0e0e0" font-size="11">Q</text>

  <!-- XOR truth table -->
  <text x="230" y="366" text-anchor="middle" fill="#8e99a4" font-size="10" font-weight="bold">A</text>
  <text x="260" y="366" text-anchor="middle" fill="#8e99a4" font-size="10" font-weight="bold">B</text>
  <text x="300" y="366" text-anchor="middle" fill="#8e99a4" font-size="10" font-weight="bold">Q</text>
  <line x1="210" y1="370" x2="320" y2="370" stroke="#3a3a5a" stroke-width="1"/>
  <text x="230" y="386" text-anchor="middle" fill="#e0e0e0" font-size="10" font-family="monospace">0</text>
  <text x="260" y="386" text-anchor="middle" fill="#e0e0e0" font-size="10" font-family="monospace">0</text>
  <text x="300" y="386" text-anchor="middle" fill="#ce93d8" font-size="10" font-family="monospace">0</text>
  <text x="230" y="402" text-anchor="middle" fill="#e0e0e0" font-size="10" font-family="monospace">0</text>
  <text x="260" y="402" text-anchor="middle" fill="#e0e0e0" font-size="10" font-family="monospace">1</text>
  <text x="300" y="402" text-anchor="middle" fill="#fff176" font-size="10" font-family="monospace">1</text>
  <text x="230" y="418" text-anchor="middle" fill="#e0e0e0" font-size="10" font-family="monospace">1</text>
  <text x="260" y="418" text-anchor="middle" fill="#e0e0e0" font-size="10" font-family="monospace">0</text>
  <text x="300" y="418" text-anchor="middle" fill="#fff176" font-size="10" font-family="monospace">1</text>
  <text x="230" y="434" text-anchor="middle" fill="#e0e0e0" font-size="10" font-family="monospace">1</text>
  <text x="260" y="434" text-anchor="middle" fill="#e0e0e0" font-size="10" font-family="monospace">1</text>
  <text x="300" y="434" text-anchor="middle" fill="#ce93d8" font-size="10" font-family="monospace">0</text>

  <!-- Annotation area (right side) -->
  <text x="520" y="80" text-anchor="middle" fill="#e0e0e0" font-size="13" font-weight="bold">Key Insight</text>
  <text x="520" y="110" text-anchor="middle" fill="#8e99a4" font-size="11">Every digital circuit</text>
  <text x="520" y="128" text-anchor="middle" fill="#8e99a4" font-size="11">is built from these</text>
  <text x="520" y="146" text-anchor="middle" fill="#8e99a4" font-size="11">four gates.</text>

  <text x="520" y="180" text-anchor="middle" fill="#8e99a4" font-size="11">In fact, NAND alone</text>
  <text x="520" y="198" text-anchor="middle" fill="#8e99a4" font-size="11">is enough to build</text>
  <text x="520" y="216" text-anchor="middle" fill="#8e99a4" font-size="11">all the others.</text>

  <text x="520" y="320" text-anchor="middle" fill="#5c6370" font-size="11">XOR = the heart of</text>
  <text x="520" y="338" text-anchor="middle" fill="#5c6370" font-size="11">binary addition</text>
  <text x="520" y="370" text-anchor="middle" fill="#5c6370" font-size="11">AND = the heart of</text>
  <text x="520" y="388" text-anchor="middle" fill="#5c6370" font-size="11">the carry bit</text>

  <text x="360" y="470" text-anchor="middle" fill="#5c6370" font-size="10">The Four Fundamental Logic Gates</text>
</svg>
