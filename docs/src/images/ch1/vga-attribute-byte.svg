<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" font-family="system-ui, -apple-system, sans-serif">
  <rect width="600" height="240" fill="#1a1a2e"/>

  <text x="300" y="24" text-anchor="middle" fill="#e0e0e0" font-size="14" font-weight="bold">VGA Attribute Byte Layout</text>

  <!-- Bit position labels -->
  <text x="95" y="52" text-anchor="middle" fill="#8e99a4" font-size="10">Bit 7</text>
  <text x="150" y="52" text-anchor="middle" fill="#8e99a4" font-size="10">6</text>
  <text x="205" y="52" text-anchor="middle" fill="#8e99a4" font-size="10">5</text>
  <text x="260" y="52" text-anchor="middle" fill="#8e99a4" font-size="10">4</text>
  <text x="330" y="52" text-anchor="middle" fill="#8e99a4" font-size="10">3</text>
  <text x="385" y="52" text-anchor="middle" fill="#8e99a4" font-size="10">2</text>
  <text x="440" y="52" text-anchor="middle" fill="#8e99a4" font-size="10">1</text>
  <text x="495" y="52" text-anchor="middle" fill="#8e99a4" font-size="10">0</text>

  <!-- Background nibble (bits 7-4) -->
  <rect x="68" y="60" width="55" height="44" rx="4" fill="#1b2a3a" stroke="#4fc3f7" stroke-width="2"/>
  <text x="95" y="87" text-anchor="middle" fill="#4fc3f7" font-size="16" font-weight="bold" font-family="monospace">0</text>
  <rect x="123" y="60" width="55" height="44" rx="4" fill="#1b2a3a" stroke="#4fc3f7" stroke-width="2"/>
  <text x="150" y="87" text-anchor="middle" fill="#4fc3f7" font-size="16" font-weight="bold" font-family="monospace">0</text>
  <rect x="178" y="60" width="55" height="44" rx="4" fill="#1b2a3a" stroke="#4fc3f7" stroke-width="2"/>
  <text x="205" y="87" text-anchor="middle" fill="#4fc3f7" font-size="16" font-weight="bold" font-family="monospace">0</text>
  <rect x="233" y="60" width="55" height="44" rx="4" fill="#1b2a3a" stroke="#4fc3f7" stroke-width="2"/>
  <text x="260" y="87" text-anchor="middle" fill="#4fc3f7" font-size="16" font-weight="bold" font-family="monospace">1</text>

  <!-- Foreground nibble (bits 3-0) -->
  <rect x="303" y="60" width="55" height="44" rx="4" fill="#1a2e1a" stroke="#81c784" stroke-width="2"/>
  <text x="330" y="87" text-anchor="middle" fill="#81c784" font-size="16" font-weight="bold" font-family="monospace">0</text>
  <rect x="358" y="60" width="55" height="44" rx="4" fill="#1a2e1a" stroke="#81c784" stroke-width="2"/>
  <text x="385" y="87" text-anchor="middle" fill="#81c784" font-size="16" font-weight="bold" font-family="monospace">1</text>
  <rect x="413" y="60" width="55" height="44" rx="4" fill="#1a2e1a" stroke="#81c784" stroke-width="2"/>
  <text x="440" y="87" text-anchor="middle" fill="#81c784" font-size="16" font-weight="bold" font-family="monospace">1</text>
  <rect x="468" y="60" width="55" height="44" rx="4" fill="#1a2e1a" stroke="#81c784" stroke-width="2"/>
  <text x="495" y="87" text-anchor="middle" fill="#81c784" font-size="16" font-weight="bold" font-family="monospace">1</text>

  <!-- Bracket: Background -->
  <line x1="68" y1="112" x2="288" y2="112" stroke="#4fc3f7" stroke-width="1.5"/>
  <line x1="68" y1="108" x2="68" y2="112" stroke="#4fc3f7" stroke-width="1.5"/>
  <line x1="288" y1="108" x2="288" y2="112" stroke="#4fc3f7" stroke-width="1.5"/>
  <line x1="178" y1="112" x2="178" y2="124" stroke="#4fc3f7" stroke-width="1.5"/>
  <text x="178" y="140" text-anchor="middle" fill="#4fc3f7" font-size="12" font-weight="bold">Background Color</text>
  <text x="178" y="156" text-anchor="middle" fill="#4fc3f7" font-size="11">= 1 (Blue)</text>

  <!-- Bracket: Foreground -->
  <line x1="303" y1="112" x2="523" y2="112" stroke="#81c784" stroke-width="1.5"/>
  <line x1="303" y1="108" x2="303" y2="112" stroke="#81c784" stroke-width="1.5"/>
  <line x1="523" y1="108" x2="523" y2="112" stroke="#81c784" stroke-width="1.5"/>
  <line x1="413" y1="112" x2="413" y2="124" stroke="#81c784" stroke-width="1.5"/>
  <text x="413" y="140" text-anchor="middle" fill="#81c784" font-size="12" font-weight="bold">Foreground Color</text>
  <text x="413" y="156" text-anchor="middle" fill="#81c784" font-size="11">= 7 (White)</text>

  <!-- Result -->
  <text x="300" y="185" text-anchor="middle" fill="#e0e0e0" font-size="13">Full byte: <tspan fill="#4fc3f7" font-family="monospace">0001</tspan> <tspan fill="#81c784" font-family="monospace">0111</tspan> = <tspan font-family="monospace" font-weight="bold">0x17</tspan></text>

  <!-- Visual preview -->
  <rect x="220" y="200" width="160" height="30" rx="4" fill="#0000AA" stroke="#3a3a5a" stroke-width="1"/>
  <text x="300" y="221" text-anchor="middle" fill="#AAAAAA" font-size="14" font-family="monospace" font-weight="bold">Hello</text>
  <text x="300" y="238" text-anchor="middle" fill="#5c6370" font-size="9">White text on blue background</text>
</svg>
