<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" font-family="system-ui, -apple-system, sans-serif">
  <rect width="700" height="380" fill="#1a1a2e"/>

  <!-- ========== AND Panel ========== -->
  <rect x="15" y="15" width="325" height="160" rx="8" fill="#1a1a2e" stroke="#3a3a5a" stroke-width="1"/>
  <text x="178" y="38" text-anchor="middle" fill="#81c784" font-size="14" font-weight="bold">AND (&amp;)</text>

  <!-- AND bits -->
  <text x="30" y="65" fill="#8e99a4" font-size="11">A:</text>
  <text x="60" y="65" fill="#81c784" font-size="13" font-family="monospace">1</text><text x="80" y="65" fill="#81c784" font-size="13" font-family="monospace">1</text><text x="100" y="65" fill="#5c6370" font-size="13" font-family="monospace">0</text><text x="120" y="65" fill="#5c6370" font-size="13" font-family="monospace">0</text><text x="140" y="65" fill="#81c784" font-size="13" font-family="monospace">1</text><text x="160" y="65" fill="#5c6370" font-size="13" font-family="monospace">0</text><text x="180" y="65" fill="#81c784" font-size="13" font-family="monospace">1</text><text x="200" y="65" fill="#5c6370" font-size="13" font-family="monospace">0</text>
  <text x="230" y="65" fill="#8e99a4" font-size="10">(0xCA)</text>

  <text x="30" y="88" fill="#8e99a4" font-size="11">B:</text>
  <text x="60" y="88" fill="#81c784" font-size="13" font-family="monospace">1</text><text x="80" y="88" fill="#81c784" font-size="13" font-family="monospace">1</text><text x="100" y="88" fill="#81c784" font-size="13" font-family="monospace">1</text><text x="120" y="88" fill="#81c784" font-size="13" font-family="monospace">1</text><text x="140" y="88" fill="#5c6370" font-size="13" font-family="monospace">0</text><text x="160" y="88" fill="#5c6370" font-size="13" font-family="monospace">0</text><text x="180" y="88" fill="#5c6370" font-size="13" font-family="monospace">0</text><text x="200" y="88" fill="#5c6370" font-size="13" font-family="monospace">0</text>
  <text x="230" y="88" fill="#8e99a4" font-size="10">(0xF0)</text>

  <line x1="55" y1="96" x2="215" y2="96" stroke="#5c6370" stroke-width="1"/>

  <text x="30" y="118" fill="#8e99a4" font-size="11">Q:</text>
  <text x="60" y="118" fill="#fff176" font-size="13" font-weight="bold" font-family="monospace">1</text><text x="80" y="118" fill="#fff176" font-size="13" font-weight="bold" font-family="monospace">1</text><text x="100" y="118" fill="#5c6370" font-size="13" font-family="monospace">0</text><text x="120" y="118" fill="#5c6370" font-size="13" font-family="monospace">0</text><text x="140" y="118" fill="#5c6370" font-size="13" font-family="monospace">0</text><text x="160" y="118" fill="#5c6370" font-size="13" font-family="monospace">0</text><text x="180" y="118" fill="#5c6370" font-size="13" font-family="monospace">0</text><text x="200" y="118" fill="#5c6370" font-size="13" font-family="monospace">0</text>
  <text x="230" y="118" fill="#fff176" font-size="10">(0xC0)</text>

  <text x="178" y="150" text-anchor="middle" fill="#5c6370" font-size="10">Both must be 1 to stay 1</text>

  <!-- ========== OR Panel ========== -->
  <rect x="360" y="15" width="325" height="160" rx="8" fill="#1a1a2e" stroke="#3a3a5a" stroke-width="1"/>
  <text x="523" y="38" text-anchor="middle" fill="#ffb74d" font-size="14" font-weight="bold">OR (|)</text>

  <text x="375" y="65" fill="#8e99a4" font-size="11">A:</text>
  <text x="405" y="65" fill="#ffb74d" font-size="13" font-family="monospace">1</text><text x="425" y="65" fill="#ffb74d" font-size="13" font-family="monospace">1</text><text x="445" y="65" fill="#5c6370" font-size="13" font-family="monospace">0</text><text x="465" y="65" fill="#5c6370" font-size="13" font-family="monospace">0</text><text x="485" y="65" fill="#ffb74d" font-size="13" font-family="monospace">1</text><text x="505" y="65" fill="#5c6370" font-size="13" font-family="monospace">0</text><text x="525" y="65" fill="#ffb74d" font-size="13" font-family="monospace">1</text><text x="545" y="65" fill="#5c6370" font-size="13" font-family="monospace">0</text>
  <text x="575" y="65" fill="#8e99a4" font-size="10">(0xCA)</text>

  <text x="375" y="88" fill="#8e99a4" font-size="11">B:</text>
  <text x="405" y="88" fill="#5c6370" font-size="13" font-family="monospace">0</text><text x="425" y="88" fill="#5c6370" font-size="13" font-family="monospace">0</text><text x="445" y="88" fill="#5c6370" font-size="13" font-family="monospace">0</text><text x="465" y="88" fill="#5c6370" font-size="13" font-family="monospace">0</text><text x="485" y="88" fill="#ffb74d" font-size="13" font-family="monospace">1</text><text x="505" y="88" fill="#ffb74d" font-size="13" font-family="monospace">1</text><text x="525" y="88" fill="#ffb74d" font-size="13" font-family="monospace">1</text><text x="545" y="88" fill="#ffb74d" font-size="13" font-family="monospace">1</text>
  <text x="575" y="88" fill="#8e99a4" font-size="10">(0x0F)</text>

  <line x1="400" y1="96" x2="560" y2="96" stroke="#5c6370" stroke-width="1"/>

  <text x="375" y="118" fill="#8e99a4" font-size="11">Q:</text>
  <text x="405" y="118" fill="#fff176" font-size="13" font-weight="bold" font-family="monospace">1</text><text x="425" y="118" fill="#fff176" font-size="13" font-weight="bold" font-family="monospace">1</text><text x="445" y="118" fill="#5c6370" font-size="13" font-family="monospace">0</text><text x="465" y="118" fill="#5c6370" font-size="13" font-family="monospace">0</text><text x="485" y="118" fill="#fff176" font-size="13" font-weight="bold" font-family="monospace">1</text><text x="505" y="118" fill="#fff176" font-size="13" font-weight="bold" font-family="monospace">1</text><text x="525" y="118" fill="#fff176" font-size="13" font-weight="bold" font-family="monospace">1</text><text x="545" y="118" fill="#fff176" font-size="13" font-weight="bold" font-family="monospace">1</text>
  <text x="575" y="118" fill="#fff176" font-size="10">(0xCF)</text>

  <text x="523" y="150" text-anchor="middle" fill="#5c6370" font-size="10">Either being 1 makes the result 1</text>

  <!-- ========== XOR Panel ========== -->
  <rect x="15" y="195" width="325" height="160" rx="8" fill="#1a1a2e" stroke="#3a3a5a" stroke-width="1"/>
  <text x="178" y="218" text-anchor="middle" fill="#ce93d8" font-size="14" font-weight="bold">XOR (^)</text>

  <text x="30" y="245" fill="#8e99a4" font-size="11">A:</text>
  <text x="60" y="245" fill="#ce93d8" font-size="13" font-family="monospace">1</text><text x="80" y="245" fill="#ce93d8" font-size="13" font-family="monospace">1</text><text x="100" y="245" fill="#5c6370" font-size="13" font-family="monospace">0</text><text x="120" y="245" fill="#5c6370" font-size="13" font-family="monospace">0</text><text x="140" y="245" fill="#ce93d8" font-size="13" font-family="monospace">1</text><text x="160" y="245" fill="#5c6370" font-size="13" font-family="monospace">0</text><text x="180" y="245" fill="#ce93d8" font-size="13" font-family="monospace">1</text><text x="200" y="245" fill="#5c6370" font-size="13" font-family="monospace">0</text>
  <text x="230" y="245" fill="#8e99a4" font-size="10">(0xCA)</text>

  <text x="30" y="268" fill="#8e99a4" font-size="11">B:</text>
  <text x="60" y="268" fill="#ce93d8" font-size="13" font-family="monospace">1</text><text x="80" y="268" fill="#ce93d8" font-size="13" font-family="monospace">1</text><text x="100" y="268" fill="#ce93d8" font-size="13" font-family="monospace">1</text><text x="120" y="268" fill="#ce93d8" font-size="13" font-family="monospace">1</text><text x="140" y="268" fill="#5c6370" font-size="13" font-family="monospace">0</text><text x="160" y="268" fill="#5c6370" font-size="13" font-family="monospace">0</text><text x="180" y="268" fill="#5c6370" font-size="13" font-family="monospace">0</text><text x="200" y="268" fill="#5c6370" font-size="13" font-family="monospace">0</text>
  <text x="230" y="268" fill="#8e99a4" font-size="10">(0xF0)</text>

  <line x1="55" y1="276" x2="215" y2="276" stroke="#5c6370" stroke-width="1"/>

  <text x="30" y="298" fill="#8e99a4" font-size="11">Q:</text>
  <text x="60" y="298" fill="#5c6370" font-size="13" font-family="monospace">0</text><text x="80" y="298" fill="#5c6370" font-size="13" font-family="monospace">0</text><text x="100" y="298" fill="#fff176" font-size="13" font-weight="bold" font-family="monospace">1</text><text x="120" y="298" fill="#fff176" font-size="13" font-weight="bold" font-family="monospace">1</text><text x="140" y="298" fill="#fff176" font-size="13" font-weight="bold" font-family="monospace">1</text><text x="160" y="298" fill="#5c6370" font-size="13" font-family="monospace">0</text><text x="180" y="298" fill="#fff176" font-size="13" font-weight="bold" font-family="monospace">1</text><text x="200" y="298" fill="#5c6370" font-size="13" font-family="monospace">0</text>
  <text x="230" y="298" fill="#fff176" font-size="10">(0x3A)</text>

  <text x="178" y="330" text-anchor="middle" fill="#5c6370" font-size="10">Different bits produce 1, same bits produce 0</text>

  <!-- ========== NOT Panel ========== -->
  <rect x="360" y="195" width="325" height="160" rx="8" fill="#1a1a2e" stroke="#3a3a5a" stroke-width="1"/>
  <text x="523" y="218" text-anchor="middle" fill="#ef5350" font-size="14" font-weight="bold">NOT (~)</text>

  <text x="375" y="255" fill="#8e99a4" font-size="11">A:</text>
  <text x="405" y="255" fill="#ef5350" font-size="13" font-family="monospace">1</text><text x="425" y="255" fill="#ef5350" font-size="13" font-family="monospace">1</text><text x="445" y="255" fill="#5c6370" font-size="13" font-family="monospace">0</text><text x="465" y="255" fill="#5c6370" font-size="13" font-family="monospace">0</text><text x="485" y="255" fill="#ef5350" font-size="13" font-family="monospace">1</text><text x="505" y="255" fill="#5c6370" font-size="13" font-family="monospace">0</text><text x="525" y="255" fill="#ef5350" font-size="13" font-family="monospace">1</text><text x="545" y="255" fill="#5c6370" font-size="13" font-family="monospace">0</text>
  <text x="575" y="255" fill="#8e99a4" font-size="10">(0xCA)</text>

  <line x1="400" y1="266" x2="560" y2="266" stroke="#5c6370" stroke-width="1"/>

  <text x="375" y="290" fill="#8e99a4" font-size="11">Q:</text>
  <text x="405" y="290" fill="#5c6370" font-size="13" font-family="monospace">0</text><text x="425" y="290" fill="#5c6370" font-size="13" font-family="monospace">0</text><text x="445" y="290" fill="#fff176" font-size="13" font-weight="bold" font-family="monospace">1</text><text x="465" y="290" fill="#fff176" font-size="13" font-weight="bold" font-family="monospace">1</text><text x="485" y="290" fill="#5c6370" font-size="13" font-family="monospace">0</text><text x="505" y="290" fill="#fff176" font-size="13" font-weight="bold" font-family="monospace">1</text><text x="525" y="290" fill="#5c6370" font-size="13" font-family="monospace">0</text><text x="545" y="290" fill="#fff176" font-size="13" font-weight="bold" font-family="monospace">1</text>
  <text x="575" y="290" fill="#fff176" font-size="10">(0x35)</text>

  <text x="523" y="330" text-anchor="middle" fill="#5c6370" font-size="10">Every bit gets flipped</text>

  <text x="350" y="375" text-anchor="middle" fill="#5c6370" font-size="10">The Four Bitwise Operations</text>
</svg>
