<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" font-family="system-ui, -apple-system, sans-serif">
  <rect width="600" height="260" fill="#1a1a2e"/>

  <text x="300" y="24" text-anchor="middle" fill="#e0e0e0" font-size="14" font-weight="bold">ModR/M Byte Breakdown: 0xD8</text>
  <text x="300" y="42" text-anchor="middle" fill="#8e99a4" font-size="11">Instruction: ADD EAX, EBX (machine code: 01 D8)</text>

  <!-- Binary representation -->
  <!-- Bit 7 -->
  <rect x="100" y="62" width="50" height="44" rx="4" fill="#2a1a1a" stroke="#ef5350" stroke-width="2"/>
  <text x="125" y="80" text-anchor="middle" fill="#ef5350" font-size="18" font-weight="bold" font-family="monospace">1</text>
  <text x="125" y="58" text-anchor="middle" fill="#8e99a4" font-size="9">Bit 7</text>
  <!-- Bit 6 -->
  <rect x="152" y="62" width="50" height="44" rx="4" fill="#2a1a1a" stroke="#ef5350" stroke-width="2"/>
  <text x="177" y="80" text-anchor="middle" fill="#ef5350" font-size="18" font-weight="bold" font-family="monospace">1</text>
  <text x="177" y="58" text-anchor="middle" fill="#8e99a4" font-size="9">6</text>

  <!-- Bit 5 -->
  <rect x="218" y="62" width="50" height="44" rx="4" fill="#1a2e1a" stroke="#81c784" stroke-width="2"/>
  <text x="243" y="80" text-anchor="middle" fill="#81c784" font-size="18" font-weight="bold" font-family="monospace">0</text>
  <text x="243" y="58" text-anchor="middle" fill="#8e99a4" font-size="9">5</text>
  <!-- Bit 4 -->
  <rect x="270" y="62" width="50" height="44" rx="4" fill="#1a2e1a" stroke="#81c784" stroke-width="2"/>
  <text x="295" y="80" text-anchor="middle" fill="#81c784" font-size="18" font-weight="bold" font-family="monospace">1</text>
  <text x="295" y="58" text-anchor="middle" fill="#8e99a4" font-size="9">4</text>
  <!-- Bit 3 -->
  <rect x="322" y="62" width="50" height="44" rx="4" fill="#1a2e1a" stroke="#81c784" stroke-width="2"/>
  <text x="347" y="80" text-anchor="middle" fill="#81c784" font-size="18" font-weight="bold" font-family="monospace">1</text>
  <text x="347" y="58" text-anchor="middle" fill="#8e99a4" font-size="9">3</text>

  <!-- Bit 2 -->
  <rect x="388" y="62" width="50" height="44" rx="4" fill="#1b2a3a" stroke="#4fc3f7" stroke-width="2"/>
  <text x="413" y="80" text-anchor="middle" fill="#4fc3f7" font-size="18" font-weight="bold" font-family="monospace">0</text>
  <text x="413" y="58" text-anchor="middle" fill="#8e99a4" font-size="9">2</text>
  <!-- Bit 1 -->
  <rect x="440" y="62" width="50" height="44" rx="4" fill="#1b2a3a" stroke="#4fc3f7" stroke-width="2"/>
  <text x="465" y="80" text-anchor="middle" fill="#4fc3f7" font-size="18" font-weight="bold" font-family="monospace">0</text>
  <text x="465" y="58" text-anchor="middle" fill="#8e99a4" font-size="9">1</text>
  <!-- Bit 0 -->
  <rect x="492" y="62" width="50" height="44" rx="4" fill="#1b2a3a" stroke="#4fc3f7" stroke-width="2"/>
  <text x="517" y="80" text-anchor="middle" fill="#4fc3f7" font-size="18" font-weight="bold" font-family="monospace">0</text>
  <text x="517" y="58" text-anchor="middle" fill="#8e99a4" font-size="9">0</text>

  <!-- Mod bracket (bits 7-6) -->
  <line x1="100" y1="112" x2="202" y2="112" stroke="#ef5350" stroke-width="1.5"/>
  <line x1="100" y1="108" x2="100" y2="112" stroke="#ef5350" stroke-width="1.5"/>
  <line x1="202" y1="108" x2="202" y2="112" stroke="#ef5350" stroke-width="1.5"/>
  <line x1="151" y1="112" x2="151" y2="126" stroke="#ef5350" stroke-width="1.5"/>
  <text x="151" y="142" text-anchor="middle" fill="#ef5350" font-size="12" font-weight="bold">Mod = 11</text>
  <text x="151" y="160" text-anchor="middle" fill="#ef5350" font-size="10">Register mode</text>
  <text x="151" y="175" text-anchor="middle" fill="#8e99a4" font-size="9">(both operands</text>
  <text x="151" y="187" text-anchor="middle" fill="#8e99a4" font-size="9">are registers)</text>

  <!-- Reg bracket (bits 5-3) -->
  <line x1="218" y1="112" x2="372" y2="112" stroke="#81c784" stroke-width="1.5"/>
  <line x1="218" y1="108" x2="218" y2="112" stroke="#81c784" stroke-width="1.5"/>
  <line x1="372" y1="108" x2="372" y2="112" stroke="#81c784" stroke-width="1.5"/>
  <line x1="295" y1="112" x2="295" y2="126" stroke="#81c784" stroke-width="1.5"/>
  <text x="295" y="142" text-anchor="middle" fill="#81c784" font-size="12" font-weight="bold">Reg = 011</text>
  <text x="295" y="160" text-anchor="middle" fill="#81c784" font-size="10">EBX (source)</text>
  <text x="295" y="175" text-anchor="middle" fill="#8e99a4" font-size="9">Register codes:</text>
  <text x="295" y="187" text-anchor="middle" fill="#8e99a4" font-size="9">000=EAX, 011=EBX</text>

  <!-- R/M bracket (bits 2-0) -->
  <line x1="388" y1="112" x2="542" y2="112" stroke="#4fc3f7" stroke-width="1.5"/>
  <line x1="388" y1="108" x2="388" y2="112" stroke="#4fc3f7" stroke-width="1.5"/>
  <line x1="542" y1="108" x2="542" y2="112" stroke="#4fc3f7" stroke-width="1.5"/>
  <line x1="465" y1="112" x2="465" y2="126" stroke="#4fc3f7" stroke-width="1.5"/>
  <text x="465" y="142" text-anchor="middle" fill="#4fc3f7" font-size="12" font-weight="bold">R/M = 000</text>
  <text x="465" y="160" text-anchor="middle" fill="#4fc3f7" font-size="10">EAX (destination)</text>
  <text x="465" y="175" text-anchor="middle" fill="#8e99a4" font-size="9">This is where</text>
  <text x="465" y="187" text-anchor="middle" fill="#8e99a4" font-size="9">the result goes</text>

  <!-- Bottom summary -->
  <rect x="100" y="210" width="442" height="34" rx="6" fill="#1a1a2e" stroke="#3a3a5a" stroke-width="1"/>
  <text x="321" y="232" text-anchor="middle" fill="#e0e0e0" font-size="11">0xD8 = <tspan fill="#ef5350">11</tspan><tspan fill="#81c784">011</tspan><tspan fill="#4fc3f7">000</tspan> = "ADD register <tspan fill="#4fc3f7">EAX</tspan>, register <tspan fill="#81c784">EBX</tspan>"</text>
</svg>
