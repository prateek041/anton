<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="system-ui, -apple-system, sans-serif">
  <rect width="680" height="320" fill="#1a1a2e"/>

  <text x="340" y="24" text-anchor="middle" fill="#e0e0e0" font-size="14" font-weight="bold">Aligned vs. Misaligned Memory Access</text>

  <!-- === Aligned (left) === -->
  <text x="170" y="50" text-anchor="middle" fill="#81c784" font-size="13" font-weight="bold">Aligned (address 0x1000)</text>

  <!-- 4-byte boundary marker -->
  <line x1="60" y1="68" x2="280" y2="68" stroke="#3a3a5a" stroke-width="0.5" stroke-dasharray="3,3"/>

  <!-- Cells 0x0FFC - 0x0FFF (gray, not part of our value) -->
  <rect x="80" y="70" width="44" height="30" rx="3" fill="#1a1a2e" stroke="#3a3a5a" stroke-width="1"/>
  <rect x="126" y="70" width="44" height="30" rx="3" fill="#1a1a2e" stroke="#3a3a5a" stroke-width="1"/>
  <rect x="172" y="70" width="44" height="30" rx="3" fill="#1a1a2e" stroke="#3a3a5a" stroke-width="1"/>
  <rect x="218" y="70" width="44" height="30" rx="3" fill="#1a1a2e" stroke="#3a3a5a" stroke-width="1"/>
  <text x="40" y="90" text-anchor="end" fill="#5c6370" font-size="9" font-family="monospace">0x0FFC</text>

  <!-- 4-byte boundary marker -->
  <line x1="60" y1="102" x2="280" y2="102" stroke="#81c784" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="284" y="107" fill="#81c784" font-size="8">4-byte boundary</text>

  <!-- Cells 0x1000 - 0x1003 (highlighted - our 32-bit value) -->
  <rect x="80" y="104" width="44" height="30" rx="3" fill="#1a2e1a" stroke="#81c784" stroke-width="2"/>
  <text x="102" y="124" text-anchor="middle" fill="#81c784" font-size="11" font-family="monospace">CD</text>
  <rect x="126" y="104" width="44" height="30" rx="3" fill="#1a2e1a" stroke="#81c784" stroke-width="2"/>
  <text x="148" y="124" text-anchor="middle" fill="#81c784" font-size="11" font-family="monospace">AB</text>
  <rect x="172" y="104" width="44" height="30" rx="3" fill="#1a2e1a" stroke="#81c784" stroke-width="2"/>
  <text x="194" y="124" text-anchor="middle" fill="#81c784" font-size="11" font-family="monospace">34</text>
  <rect x="218" y="104" width="44" height="30" rx="3" fill="#1a2e1a" stroke="#81c784" stroke-width="2"/>
  <text x="240" y="124" text-anchor="middle" fill="#81c784" font-size="11" font-family="monospace">12</text>
  <text x="40" y="124" text-anchor="end" fill="#e0e0e0" font-size="9" font-family="monospace">0x1000</text>

  <!-- One fetch bracket -->
  <line x1="80" y1="140" x2="262" y2="140" stroke="#81c784" stroke-width="1.5"/>
  <line x1="80" y1="136" x2="80" y2="140" stroke="#81c784" stroke-width="1.5"/>
  <line x1="262" y1="136" x2="262" y2="140" stroke="#81c784" stroke-width="1.5"/>
  <text x="170" y="158" text-anchor="middle" fill="#81c784" font-size="11" font-weight="bold">1 fetch</text>

  <!-- === Misaligned (right) === -->
  <text x="510" y="50" text-anchor="middle" fill="#ef5350" font-size="13" font-weight="bold">Misaligned (address 0x1001)</text>

  <!-- 4-byte boundary marker -->
  <line x1="400" y1="68" x2="620" y2="68" stroke="#3a3a5a" stroke-width="0.5" stroke-dasharray="3,3"/>

  <!-- Cells 0x1000 row (the value straddles this boundary) -->
  <rect x="420" y="70" width="44" height="30" rx="3" fill="#1a1a2e" stroke="#3a3a5a" stroke-width="1"/>
  <rect x="466" y="70" width="44" height="30" rx="3" fill="#2a1a1a" stroke="#ef5350" stroke-width="2"/>
  <text x="488" y="90" text-anchor="middle" fill="#ef5350" font-size="11" font-family="monospace">CD</text>
  <rect x="512" y="70" width="44" height="30" rx="3" fill="#2a1a1a" stroke="#ef5350" stroke-width="2"/>
  <text x="534" y="90" text-anchor="middle" fill="#ef5350" font-size="11" font-family="monospace">AB</text>
  <rect x="558" y="70" width="44" height="30" rx="3" fill="#2a1a1a" stroke="#ef5350" stroke-width="2"/>
  <text x="580" y="90" text-anchor="middle" fill="#ef5350" font-size="11" font-family="monospace">34</text>
  <text x="380" y="90" text-anchor="end" fill="#e0e0e0" font-size="9" font-family="monospace">0x1000</text>

  <!-- 4-byte boundary marker -->
  <line x1="400" y1="102" x2="620" y2="102" stroke="#ef5350" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="624" y="107" fill="#ef5350" font-size="8">boundary</text>

  <!-- Cells 0x1004 row -->
  <rect x="420" y="104" width="44" height="30" rx="3" fill="#2a1a1a" stroke="#ef5350" stroke-width="2"/>
  <text x="442" y="124" text-anchor="middle" fill="#ef5350" font-size="11" font-family="monospace">12</text>
  <rect x="466" y="104" width="44" height="30" rx="3" fill="#1a1a2e" stroke="#3a3a5a" stroke-width="1"/>
  <rect x="512" y="104" width="44" height="30" rx="3" fill="#1a1a2e" stroke="#3a3a5a" stroke-width="1"/>
  <rect x="558" y="104" width="44" height="30" rx="3" fill="#1a1a2e" stroke="#3a3a5a" stroke-width="1"/>
  <text x="380" y="124" text-anchor="end" fill="#e0e0e0" font-size="9" font-family="monospace">0x1004</text>

  <!-- Two fetch brackets -->
  <line x1="466" y1="60" x2="602" y2="60" stroke="#ef5350" stroke-width="1.5"/>
  <text x="534" y="56" text-anchor="middle" fill="#ef5350" font-size="9">Fetch 1</text>
  <line x1="420" y1="140" x2="464" y2="140" stroke="#ef5350" stroke-width="1.5"/>
  <text x="442" y="155" text-anchor="middle" fill="#ef5350" font-size="9">Fetch 2</text>

  <text x="510" y="175" text-anchor="middle" fill="#ef5350" font-size="11" font-weight="bold">2 fetches needed!</text>

  <!-- Bottom explanation -->
  <rect x="40" y="200" width="600" height="100" rx="8" fill="#1a1a2e" stroke="#3a3a5a" stroke-width="1"/>
  <text x="340" y="225" text-anchor="middle" fill="#e0e0e0" font-size="12" font-weight="bold">Why alignment matters:</text>
  <text x="340" y="248" text-anchor="middle" fill="#8e99a4" font-size="11">The CPU fetches data in aligned chunks matching its word size.</text>
  <text x="340" y="268" text-anchor="middle" fill="#8e99a4" font-size="11">An aligned 4-byte value fits in one chunk. A misaligned one spans two.</text>
  <text x="340" y="288" text-anchor="middle" fill="#8e99a4" font-size="11">Rule: an N-byte value should sit at an address divisible by N.</text>
</svg>
