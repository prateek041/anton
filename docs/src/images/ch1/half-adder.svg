<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" font-family="system-ui, -apple-system, sans-serif">
  <rect width="520" height="260" fill="#1a1a2e"/>

  <defs>
    <marker id="ha-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e0e0e0"/>
    </marker>
  </defs>

  <text x="260" y="25" text-anchor="middle" fill="#e0e0e0" font-size="15" font-weight="bold">Half-Adder</text>

  <!-- Input A -->
  <text x="30" y="88" text-anchor="end" fill="#e0e0e0" font-size="14" font-weight="bold">A</text>
  <line x1="40" y1="84" x2="120" y2="84" stroke="#e0e0e0" stroke-width="2"/>

  <!-- Input B -->
  <text x="30" y="168" text-anchor="end" fill="#e0e0e0" font-size="14" font-weight="bold">B</text>
  <line x1="40" y1="164" x2="120" y2="164" stroke="#e0e0e0" stroke-width="2"/>

  <!-- Split dots -->
  <circle cx="100" cy="84" r="3" fill="#e0e0e0"/>
  <circle cx="100" cy="164" r="3" fill="#e0e0e0"/>

  <!-- Wire from A split down to AND gate -->
  <line x1="100" y1="84" x2="100" y2="100" stroke="#e0e0e0" stroke-width="1.5"/>
  <line x1="100" y1="100" x2="140" y2="100" stroke="#e0e0e0" stroke-width="1.5"/>

  <!-- Wire from B split up to XOR gate -->
  <line x1="100" y1="164" x2="100" y2="148" stroke="#e0e0e0" stroke-width="1.5"/>
  <line x1="100" y1="148" x2="140" y2="148" stroke="#e0e0e0" stroke-width="1.5"/>

  <!-- Wire A to XOR -->
  <line x1="120" y1="84" x2="140" y2="84" stroke="#e0e0e0" stroke-width="1.5"/>
  <!-- Wire B to AND -->
  <line x1="120" y1="164" x2="140" y2="164" stroke="#e0e0e0" stroke-width="1.5"/>

  <!-- XOR Gate box -->
  <rect x="140" y="60" width="120" height="56" rx="8" fill="#1a1a2e" stroke="#ce93d8" stroke-width="2.5"/>
  <text x="200" y="93" text-anchor="middle" fill="#ce93d8" font-size="14" font-weight="bold">XOR</text>

  <!-- AND Gate box -->
  <rect x="140" y="132" width="120" height="56" rx="8" fill="#1a1a2e" stroke="#81c784" stroke-width="2.5"/>
  <text x="200" y="165" text-anchor="middle" fill="#81c784" font-size="14" font-weight="bold">AND</text>

  <!-- XOR output -> Sum -->
  <line x1="260" y1="88" x2="380" y2="88" stroke="#ce93d8" stroke-width="2.5" marker-end="url(#ha-arr)"/>
  <rect x="380" y="70" width="110" height="36" rx="6" fill="#2a1a3a" stroke="#ce93d8" stroke-width="2"/>
  <text x="435" y="93" text-anchor="middle" fill="#ce93d8" font-size="13" font-weight="bold">Sum</text>

  <!-- AND output -> Carry -->
  <line x1="260" y1="160" x2="380" y2="160" stroke="#81c784" stroke-width="2.5" marker-end="url(#ha-arr)"/>
  <rect x="380" y="142" width="110" height="36" rx="6" fill="#1a2e1a" stroke="#81c784" stroke-width="2"/>
  <text x="435" y="165" text-anchor="middle" fill="#81c784" font-size="13" font-weight="bold">Carry</text>

  <!-- Caption -->
  <text x="260" y="230" text-anchor="middle" fill="#8e99a4" font-size="11">Sum = A XOR B</text>
  <text x="260" y="248" text-anchor="middle" fill="#8e99a4" font-size="11">Carry = A AND B</text>
</svg>
