<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" font-family="system-ui, -apple-system, sans-serif">
  <rect width="640" height="220" fill="#1a1a2e"/>

  <text x="320" y="24" text-anchor="middle" fill="#e0e0e0" font-size="14" font-weight="bold">Instruction Encoding: MOV EAX, 5</text>

  <!-- The 5 bytes -->
  <rect x="90" y="50" width="80" height="50" rx="6" fill="#2a1a3a" stroke="#ce93d8" stroke-width="2.5"/>
  <text x="130" y="80" text-anchor="middle" fill="#ce93d8" font-size="20" font-weight="bold" font-family="monospace">B8</text>

  <rect x="180" y="50" width="80" height="50" rx="6" fill="#1b2a3a" stroke="#4fc3f7" stroke-width="2"/>
  <text x="220" y="80" text-anchor="middle" fill="#4fc3f7" font-size="20" font-weight="bold" font-family="monospace">05</text>

  <rect x="270" y="50" width="80" height="50" rx="6" fill="#1b2a3a" stroke="#4fc3f7" stroke-width="2"/>
  <text x="310" y="80" text-anchor="middle" fill="#4fc3f7" font-size="20" font-weight="bold" font-family="monospace">00</text>

  <rect x="360" y="50" width="80" height="50" rx="6" fill="#1b2a3a" stroke="#4fc3f7" stroke-width="2"/>
  <text x="400" y="80" text-anchor="middle" fill="#4fc3f7" font-size="20" font-weight="bold" font-family="monospace">00</text>

  <rect x="450" y="50" width="80" height="50" rx="6" fill="#1b2a3a" stroke="#4fc3f7" stroke-width="2"/>
  <text x="490" y="80" text-anchor="middle" fill="#4fc3f7" font-size="20" font-weight="bold" font-family="monospace">00</text>

  <!-- Byte index labels -->
  <text x="130" y="46" text-anchor="middle" fill="#8e99a4" font-size="9">byte 0</text>
  <text x="220" y="46" text-anchor="middle" fill="#8e99a4" font-size="9">byte 1</text>
  <text x="310" y="46" text-anchor="middle" fill="#8e99a4" font-size="9">byte 2</text>
  <text x="400" y="46" text-anchor="middle" fill="#8e99a4" font-size="9">byte 3</text>
  <text x="490" y="46" text-anchor="middle" fill="#8e99a4" font-size="9">byte 4</text>

  <!-- Opcode bracket -->
  <line x1="90" y1="108" x2="170" y2="108" stroke="#ce93d8" stroke-width="1.5"/>
  <line x1="90" y1="104" x2="90" y2="108" stroke="#ce93d8" stroke-width="1.5"/>
  <line x1="170" y1="104" x2="170" y2="108" stroke="#ce93d8" stroke-width="1.5"/>
  <line x1="130" y1="108" x2="130" y2="122" stroke="#ce93d8" stroke-width="1.5"/>
  <text x="130" y="138" text-anchor="middle" fill="#ce93d8" font-size="11" font-weight="bold">Opcode</text>
  <text x="130" y="154" text-anchor="middle" fill="#ce93d8" font-size="10">MOV EAX, imm32</text>
  <text x="130" y="168" text-anchor="middle" fill="#8e99a4" font-size="9">"Put a 32-bit immediate</text>
  <text x="130" y="180" text-anchor="middle" fill="#8e99a4" font-size="9">value into EAX"</text>

  <!-- Immediate value bracket -->
  <line x1="180" y1="108" x2="530" y2="108" stroke="#4fc3f7" stroke-width="1.5"/>
  <line x1="180" y1="104" x2="180" y2="108" stroke="#4fc3f7" stroke-width="1.5"/>
  <line x1="530" y1="104" x2="530" y2="108" stroke="#4fc3f7" stroke-width="1.5"/>
  <line x1="355" y1="108" x2="355" y2="122" stroke="#4fc3f7" stroke-width="1.5"/>
  <text x="355" y="138" text-anchor="middle" fill="#4fc3f7" font-size="11" font-weight="bold">Immediate Value</text>
  <text x="355" y="154" text-anchor="middle" fill="#4fc3f7" font-size="10">0x00000005 (little-endian)</text>
  <text x="355" y="168" text-anchor="middle" fill="#8e99a4" font-size="9">Least significant byte (05) is stored first.</text>
  <text x="355" y="180" text-anchor="middle" fill="#8e99a4" font-size="9">Reads as the number 5.</text>

  <!-- Total size -->
  <text x="320" y="210" text-anchor="middle" fill="#5c6370" font-size="10">Total instruction size: 5 bytes (1 opcode + 4 immediate)</text>
</svg>
