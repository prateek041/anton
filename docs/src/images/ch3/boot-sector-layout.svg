<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" font-family="system-ui, -apple-system, sans-serif">
  <rect width="500" height="400" fill="#1a1a2e"/>

  <text x="250" y="24" text-anchor="middle" fill="#e0e0e0" font-size="14" font-weight="bold">Boot Sector Layout (512 Bytes)</text>

  <!-- Byte offset labels on left -->
  <text x="60" y="60" text-anchor="end" fill="#8e99a4" font-size="10" font-family="monospace">Offset 0x000</text>
  <text x="60" y="195" text-anchor="end" fill="#8e99a4" font-size="10" font-family="monospace">variable</text>
  <text x="60" y="310" text-anchor="end" fill="#8e99a4" font-size="10" font-family="monospace">Offset 0x1FE</text>
  <text x="60" y="350" text-anchor="end" fill="#8e99a4" font-size="10" font-family="monospace">Offset 0x1FF</text>

  <!-- Main 512-byte block -->
  <!-- Code/Data region -->
  <rect x="80" y="45" width="200" height="140" rx="4" fill="#1b3a2a" stroke="#81c784" stroke-width="2"/>
  <text x="180" y="95" text-anchor="middle" fill="#81c784" font-size="12" font-weight="bold">Your Code</text>
  <text x="180" y="115" text-anchor="middle" fill="#e0e0e0" font-size="9">&amp; Data</text>
  <text x="180" y="135" text-anchor="middle" fill="#e0e0e0" font-size="9">(variable length)</text>
  <text x="180" y="155" text-anchor="middle" fill="#8e99a4" font-size="8">mov ax, 0x07C0</text>
  <text x="180" y="167" text-anchor="middle" fill="#8e99a4" font-size="8">mov ds, ax ...</text>

  <!-- Padding region -->
  <rect x="80" y="185" width="200" height="110" rx="0" fill="#2a2a4a" stroke="#fff176" stroke-width="1.5"/>
  <text x="180" y="235" text-anchor="middle" fill="#fff176" font-size="11" font-weight="bold">Zero Padding</text>
  <text x="180" y="255" text-anchor="middle" fill="#e0e0e0" font-size="9" font-family="monospace">times 510-($-$$) db 0</text>
  <text x="180" y="275" text-anchor="middle" fill="#8e99a4" font-size="8">Fills remaining space with 0x00</text>

  <!-- Boot signature -->
  <rect x="80" y="295" width="200" height="50" rx="4" fill="#3a1b1b" stroke="#ef5350" stroke-width="2.5"/>
  <text x="180" y="318" text-anchor="middle" fill="#ef5350" font-size="14" font-weight="bold" font-family="monospace">0x55 0xAA</text>
  <text x="180" y="336" text-anchor="middle" fill="#e0e0e0" font-size="9">Bytes 510-511: Boot signature</text>

  <!-- Size annotations on right -->
  <line x1="290" y1="45" x2="310" y2="45" stroke="#81c784" stroke-width="1"/>
  <line x1="290" y1="185" x2="310" y2="185" stroke="#81c784" stroke-width="1"/>
  <line x1="310" y1="45" x2="310" y2="185" stroke="#81c784" stroke-width="1"/>
  <text x="320" y="120" fill="#81c784" font-size="9">Up to 510</text>
  <text x="320" y="133" fill="#81c784" font-size="9">bytes</text>

  <line x1="290" y1="295" x2="310" y2="295" stroke="#ef5350" stroke-width="1"/>
  <line x1="290" y1="345" x2="310" y2="345" stroke="#ef5350" stroke-width="1"/>
  <line x1="310" y1="295" x2="310" y2="345" stroke="#ef5350" stroke-width="1"/>
  <text x="320" y="325" fill="#ef5350" font-size="9">2 bytes</text>

  <!-- BIOS check annotation -->
  <rect x="340" y="60" width="145" height="60" rx="5" fill="#2a2a4a" stroke="#4fc3f7" stroke-width="1.5"/>
  <text x="413" y="80" text-anchor="middle" fill="#4fc3f7" font-size="9" font-weight="bold">BIOS checks</text>
  <text x="413" y="95" text-anchor="middle" fill="#e0e0e0" font-size="8">bytes 510-511.</text>
  <text x="413" y="110" text-anchor="middle" fill="#e0e0e0" font-size="8">If 0xAA55, disk is bootable.</text>

  <line x1="340" y1="100" x2="285" y2="320" stroke="#4fc3f7" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Total size annotation -->
  <text x="250" y="386" text-anchor="middle" fill="#8e99a4" font-size="10">Total: exactly 512 bytes = 1 sector. BIOS loads this to 0x7C00.</text>
</svg>
