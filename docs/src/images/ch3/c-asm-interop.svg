<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 320" font-family="system-ui, -apple-system, sans-serif">
  <rect width="750" height="320" fill="#1a1a2e"/>

  <defs>
    <marker id="interop-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#fff176"/>
    </marker>
    <marker id="interop-arr-l" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto">
      <polygon points="8 0, 0 3, 8 6" fill="#fff176"/>
    </marker>
  </defs>

  <text x="375" y="22" text-anchor="middle" fill="#e0e0e0" font-size="14" font-weight="bold">C and Assembly Interop via GLOBAL / EXTERN</text>

  <!-- Direction 1: Assembly exposes to C -->
  <text x="375" y="52" text-anchor="middle" fill="#4fc3f7" font-size="11" font-weight="bold">Direction 1: Assembly function called from C</text>

  <!-- ASM file box -->
  <rect x="30" y="65" width="280" height="90" rx="6" fill="#1b2a3a" stroke="#81c784" stroke-width="2"/>
  <text x="170" y="85" text-anchor="middle" fill="#81c784" font-size="11" font-weight="bold">asm_add.asm</text>
  <text x="50" y="105" fill="#fff176" font-size="11" font-family="monospace">GLOBAL asm_add</text>
  <text x="50" y="122" fill="#e0e0e0" font-size="10" font-family="monospace">asm_add:</text>
  <text x="50" y="138" fill="#e0e0e0" font-size="10" font-family="monospace">  mov eax, [esp+4]</text>
  <text x="50" y="148" fill="#8e99a4" font-size="9" font-family="monospace">  ...</text>

  <!-- Arrow -->
  <line x1="310" y1="110" x2="438" y2="110" stroke="#fff176" stroke-width="2" marker-end="url(#interop-arr)"/>
  <text x="375" y="100" text-anchor="middle" fill="#fff176" font-size="9" font-weight="bold">Linker resolves</text>
  <text x="375" y="130" text-anchor="middle" fill="#fff176" font-size="9" font-weight="bold">symbol</text>

  <!-- C file box -->
  <rect x="440" y="65" width="280" height="90" rx="6" fill="#1b2a3a" stroke="#4fc3f7" stroke-width="2"/>
  <text x="580" y="85" text-anchor="middle" fill="#4fc3f7" font-size="11" font-weight="bold">main.c</text>
  <text x="460" y="105" fill="#fff176" font-size="11" font-family="monospace">extern int asm_add(int, int);</text>
  <text x="460" y="125" fill="#e0e0e0" font-size="10" font-family="monospace">int result = asm_add(3, 7);</text>
  <text x="460" y="145" fill="#8e99a4" font-size="9">C sees it as a normal function</text>

  <!-- Direction 2: C function called from Assembly -->
  <text x="375" y="188" text-anchor="middle" fill="#ffb74d" font-size="11" font-weight="bold">Direction 2: C function called from Assembly</text>

  <!-- ASM file box -->
  <rect x="30" y="200" width="280" height="90" rx="6" fill="#1b2a3a" stroke="#81c784" stroke-width="2"/>
  <text x="170" y="220" text-anchor="middle" fill="#81c784" font-size="11" font-weight="bold">caller.asm</text>
  <text x="50" y="240" fill="#fff176" font-size="11" font-family="monospace">EXTERN c_helper</text>
  <text x="50" y="258" fill="#e0e0e0" font-size="10" font-family="monospace">push 42</text>
  <text x="50" y="274" fill="#e0e0e0" font-size="10" font-family="monospace">call c_helper</text>

  <!-- Arrow -->
  <line x1="440" y1="245" x2="312" y2="245" stroke="#fff176" stroke-width="2" marker-end="url(#interop-arr-l)"/>
  <text x="375" y="238" text-anchor="middle" fill="#fff176" font-size="9" font-weight="bold">Linker resolves</text>
  <text x="375" y="263" text-anchor="middle" fill="#fff176" font-size="9" font-weight="bold">symbol</text>

  <!-- C file box -->
  <rect x="440" y="200" width="280" height="90" rx="6" fill="#1b2a3a" stroke="#4fc3f7" stroke-width="2"/>
  <text x="580" y="220" text-anchor="middle" fill="#4fc3f7" font-size="11" font-weight="bold">helpers.c</text>
  <text x="460" y="240" fill="#e0e0e0" font-size="10" font-family="monospace">void c_helper(int x) {</text>
  <text x="460" y="258" fill="#e0e0e0" font-size="10" font-family="monospace">  // do work</text>
  <text x="460" y="274" fill="#e0e0e0" font-size="10" font-family="monospace">}</text>

  <!-- Bottom note -->
  <text x="375" y="312" text-anchor="middle" fill="#8e99a4" font-size="9">GLOBAL makes a symbol visible to the linker. EXTERN declares a symbol defined elsewhere. Both must follow cdecl.</text>
</svg>
