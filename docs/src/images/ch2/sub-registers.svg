<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" font-family="system-ui, -apple-system, sans-serif">
  <rect width="700" height="300" fill="#1a1a2e"/>

  <text x="350" y="24" text-anchor="middle" fill="#e0e0e0" font-size="14" font-weight="bold">Register Sub-Division (EAX Family)</text>

  <!-- Bit ruler -->
  <text x="100" y="52" text-anchor="middle" fill="#8e99a4" font-size="9">31</text>
  <text x="250" y="52" text-anchor="middle" fill="#8e99a4" font-size="9">16 15</text>
  <text x="400" y="52" text-anchor="middle" fill="#8e99a4" font-size="9">8  7</text>
  <text x="550" y="52" text-anchor="middle" fill="#8e99a4" font-size="9">0</text>

  <!-- EAX full bar -->
  <rect x="100" y="60" width="450" height="40" rx="5" fill="none" stroke="#4fc3f7" stroke-width="2.5"/>
  <text x="65" y="85" text-anchor="middle" fill="#4fc3f7" font-size="14" font-weight="bold">EAX</text>
  <text x="175" y="82" text-anchor="middle" fill="#3a5a7a" font-size="10">(upper 16 bits)</text>
  <text x="175" y="94" text-anchor="middle" fill="#3a5a7a" font-size="9">no direct name</text>

  <!-- AX overlay -->
  <rect x="325" y="60" width="225" height="40" rx="0" fill="none" stroke="#81c784" stroke-width="2.5"/>
  <text x="437" y="82" text-anchor="middle" fill="#81c784" font-size="14" font-weight="bold">AX</text>

  <!-- AH -->
  <rect x="325" y="110" width="112" height="36" rx="4" fill="#2a1a3a" stroke="#ce93d8" stroke-width="2"/>
  <text x="381" y="133" text-anchor="middle" fill="#ce93d8" font-size="13" font-weight="bold">AH</text>
  <text x="381" y="158" text-anchor="middle" fill="#8e99a4" font-size="9">Bits 15-8</text>

  <!-- AL -->
  <rect x="437" y="110" width="113" height="36" rx="4" fill="#2a1a3a" stroke="#fff176" stroke-width="2"/>
  <text x="493" y="133" text-anchor="middle" fill="#fff176" font-size="13" font-weight="bold">AL</text>
  <text x="493" y="158" text-anchor="middle" fill="#8e99a4" font-size="9">Bits 7-0</text>

  <!-- Connecting lines -->
  <line x1="381" y1="100" x2="381" y2="110" stroke="#ce93d8" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="493" y1="100" x2="493" y2="110" stroke="#fff176" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Other register families -->
  <text x="350" y="190" text-anchor="middle" fill="#e0e0e0" font-size="12" font-weight="bold">All Four Data Register Families</text>

  <g>
    <!-- EAX row -->
    <rect x="80" y="205" width="120" height="24" rx="3" fill="#1b2a3a" stroke="#4fc3f7" stroke-width="1.5"/>
    <text x="140" y="221" text-anchor="middle" fill="#4fc3f7" font-size="11" font-weight="bold">EAX</text>
    <rect x="200" y="205" width="60" height="24" rx="3" fill="#1b2a3a" stroke="#81c784" stroke-width="1.5"/>
    <text x="230" y="221" text-anchor="middle" fill="#81c784" font-size="11">AX</text>
    <rect x="260" y="205" width="40" height="24" rx="3" fill="#1b2a3a" stroke="#ce93d8" stroke-width="1.5"/>
    <text x="280" y="221" text-anchor="middle" fill="#ce93d8" font-size="10">AH</text>
    <rect x="300" y="205" width="40" height="24" rx="3" fill="#1b2a3a" stroke="#fff176" stroke-width="1.5"/>
    <text x="320" y="221" text-anchor="middle" fill="#fff176" font-size="10">AL</text>
  </g>

  <g>
    <!-- EBX row -->
    <rect x="80" y="235" width="120" height="24" rx="3" fill="#1b2a3a" stroke="#4fc3f7" stroke-width="1.5"/>
    <text x="140" y="251" text-anchor="middle" fill="#4fc3f7" font-size="11" font-weight="bold">EBX</text>
    <rect x="200" y="235" width="60" height="24" rx="3" fill="#1b2a3a" stroke="#81c784" stroke-width="1.5"/>
    <text x="230" y="251" text-anchor="middle" fill="#81c784" font-size="11">BX</text>
    <rect x="260" y="235" width="40" height="24" rx="3" fill="#1b2a3a" stroke="#ce93d8" stroke-width="1.5"/>
    <text x="280" y="251" text-anchor="middle" fill="#ce93d8" font-size="10">BH</text>
    <rect x="300" y="235" width="40" height="24" rx="3" fill="#1b2a3a" stroke="#fff176" stroke-width="1.5"/>
    <text x="320" y="251" text-anchor="middle" fill="#fff176" font-size="10">BL</text>
  </g>

  <g>
    <!-- ECX row -->
    <rect x="80" y="265" width="120" height="24" rx="3" fill="#1b2a3a" stroke="#4fc3f7" stroke-width="1.5"/>
    <text x="140" y="281" text-anchor="middle" fill="#4fc3f7" font-size="11" font-weight="bold">ECX</text>
    <rect x="200" y="265" width="60" height="24" rx="3" fill="#1b2a3a" stroke="#81c784" stroke-width="1.5"/>
    <text x="230" y="281" text-anchor="middle" fill="#81c784" font-size="11">CX</text>
    <rect x="260" y="265" width="40" height="24" rx="3" fill="#1b2a3a" stroke="#ce93d8" stroke-width="1.5"/>
    <text x="280" y="281" text-anchor="middle" fill="#ce93d8" font-size="10">CH</text>
    <rect x="300" y="265" width="40" height="24" rx="3" fill="#1b2a3a" stroke="#fff176" stroke-width="1.5"/>
    <text x="320" y="281" text-anchor="middle" fill="#fff176" font-size="10">CL</text>
  </g>

  <!-- ESI/EDI note -->
  <text x="510" y="225" text-anchor="middle" fill="#8e99a4" font-size="10">ESI, EDI, ESP, EBP</text>
  <text x="510" y="240" text-anchor="middle" fill="#8e99a4" font-size="10">only have 16-bit</text>
  <text x="510" y="255" text-anchor="middle" fill="#8e99a4" font-size="10">sub-registers (SI, DI,</text>
  <text x="510" y="270" text-anchor="middle" fill="#8e99a4" font-size="10">SP, BP). No byte access.</text>
</svg>
