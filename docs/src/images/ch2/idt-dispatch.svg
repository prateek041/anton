<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 320" font-family="system-ui, -apple-system, sans-serif">
  <rect width="750" height="320" fill="#1a1a2e"/>

  <defs>
    <marker id="id-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e0e0e0"/>
    </marker>
  </defs>

  <text x="375" y="24" text-anchor="middle" fill="#e0e0e0" font-size="14" font-weight="bold">IDT Dispatch Mechanism</text>

  <!-- Vector number input -->
  <rect x="20" y="100" width="100" height="50" rx="6" fill="#1b2a3a" stroke="#fff176" stroke-width="2"/>
  <text x="70" y="122" text-anchor="middle" fill="#fff176" font-size="11" font-weight="bold">Vector #</text>
  <text x="70" y="140" text-anchor="middle" fill="#e0e0e0" font-size="10">e.g. 14</text>

  <!-- Arrow to IDT -->
  <line x1="120" y1="125" x2="168" y2="125" stroke="#e0e0e0" stroke-width="2" marker-end="url(#id-arr)"/>
  <text x="144" y="116" text-anchor="middle" fill="#8e99a4" font-size="8">index into</text>

  <!-- IDT table -->
  <rect x="170" y="40" width="160" height="220" rx="6" fill="#1b2a3a" stroke="#4fc3f7" stroke-width="2"/>
  <text x="250" y="62" text-anchor="middle" fill="#4fc3f7" font-size="12" font-weight="bold">Interrupt Descriptor</text>
  <text x="250" y="78" text-anchor="middle" fill="#4fc3f7" font-size="12" font-weight="bold">Table (IDT)</text>

  <rect x="185" y="88" width="130" height="18" rx="2" fill="#2a2a4a" stroke="#3a3a5a" stroke-width="1"/>
  <text x="250" y="101" text-anchor="middle" fill="#8e99a4" font-size="8">[0] Divide Error</text>

  <rect x="185" y="108" width="130" height="18" rx="2" fill="#2a2a4a" stroke="#3a3a5a" stroke-width="1"/>
  <text x="250" y="121" text-anchor="middle" fill="#8e99a4" font-size="8">[1] Debug</text>

  <text x="250" y="140" text-anchor="middle" fill="#5c6370" font-size="9">...</text>

  <rect x="185" y="148" width="130" height="18" rx="2" fill="#2a1a3a" stroke="#ef5350" stroke-width="2"/>
  <text x="250" y="161" text-anchor="middle" fill="#ef5350" font-size="8" font-weight="bold">[14] Page Fault</text>

  <text x="250" y="182" text-anchor="middle" fill="#5c6370" font-size="9">...</text>

  <rect x="185" y="188" width="130" height="18" rx="2" fill="#2a2a4a" stroke="#3a3a5a" stroke-width="1"/>
  <text x="250" y="201" text-anchor="middle" fill="#8e99a4" font-size="8">[32] Timer (IRQ 0)</text>

  <rect x="185" y="208" width="130" height="18" rx="2" fill="#2a2a4a" stroke="#3a3a5a" stroke-width="1"/>
  <text x="250" y="221" text-anchor="middle" fill="#8e99a4" font-size="8">[33] Keyboard (IRQ 1)</text>

  <text x="250" y="244" text-anchor="middle" fill="#5c6370" font-size="9">... up to 255</text>

  <!-- Pointer arrow to selected entry -->
  <text x="177" y="162" fill="#ef5350" font-size="12" font-weight="bold">&#x2192;</text>

  <!-- Arrow from entry to expanded gate -->
  <line x1="330" y1="157" x2="378" y2="157" stroke="#e0e0e0" stroke-width="2" marker-end="url(#id-arr)"/>

  <!-- Expanded gate descriptor -->
  <rect x="380" y="70" width="200" height="170" rx="6" fill="#1b2a3a" stroke="#ef5350" stroke-width="2"/>
  <text x="480" y="92" text-anchor="middle" fill="#ef5350" font-size="12" font-weight="bold">Gate Descriptor</text>
  <text x="480" y="108" text-anchor="middle" fill="#8e99a4" font-size="9">(8 bytes per entry)</text>

  <line x1="395" y1="118" x2="565" y2="118" stroke="#3a3a5a" stroke-width="1"/>

  <text x="400" y="138" fill="#e0e0e0" font-size="10">Handler Offset:</text>
  <text x="540" y="138" text-anchor="end" fill="#4fc3f7" font-size="10">0x001030</text>

  <text x="400" y="158" fill="#e0e0e0" font-size="10">Segment Sel:</text>
  <text x="540" y="158" text-anchor="end" fill="#ce93d8" font-size="10">0x08 (code)</text>

  <text x="400" y="178" fill="#e0e0e0" font-size="10">Type:</text>
  <text x="540" y="178" text-anchor="end" fill="#ffb74d" font-size="10">Interrupt Gate</text>

  <text x="400" y="198" fill="#e0e0e0" font-size="10">DPL:</text>
  <text x="540" y="198" text-anchor="end" fill="#81c784" font-size="10">0 (Ring 0)</text>

  <text x="400" y="218" fill="#e0e0e0" font-size="10">Present:</text>
  <text x="540" y="218" text-anchor="end" fill="#81c784" font-size="10">1 (valid)</text>

  <!-- Arrow to handler -->
  <line x1="580" y1="157" x2="618" y2="157" stroke="#e0e0e0" stroke-width="2" marker-end="url(#id-arr)"/>

  <!-- Handler code -->
  <rect x="620" y="110" width="110" height="80" rx="6" fill="#1b2a3a" stroke="#81c784" stroke-width="2"/>
  <text x="675" y="140" text-anchor="middle" fill="#81c784" font-size="11" font-weight="bold">Handler</text>
  <text x="675" y="158" text-anchor="middle" fill="#e0e0e0" font-size="9">at 0x08:0x1030</text>
  <text x="675" y="176" text-anchor="middle" fill="#8e99a4" font-size="9">page_fault_isr</text>

  <!-- IDTR note -->
  <rect x="170" y="270" width="160" height="28" rx="4" fill="#2a2a4a" stroke="#4fc3f7" stroke-width="1"/>
  <text x="250" y="289" text-anchor="middle" fill="#4fc3f7" font-size="10">IDTR points here (LIDT)</text>

  <text x="375" y="310" text-anchor="middle" fill="#5c6370" font-size="9">Interrupt gates auto-clear IF (disable further interrupts). Trap gates do not.</text>
</svg>
