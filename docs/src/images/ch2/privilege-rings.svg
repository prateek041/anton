<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" font-family="system-ui, -apple-system, sans-serif">
  <rect width="500" height="500" fill="#1a1a2e"/>

  <text x="250" y="24" text-anchor="middle" fill="#e0e0e0" font-size="14" font-weight="bold">x86 Protection Rings</text>

  <!-- Ring 3 (outermost) -->
  <circle cx="250" cy="250" r="190" fill="none" stroke="#81c784" stroke-width="3"/>
  <circle cx="250" cy="250" r="190" fill="#81c784" fill-opacity="0.06"/>
  <text x="250" y="76" text-anchor="middle" fill="#81c784" font-size="14" font-weight="bold">Ring 3</text>
  <text x="250" y="92" text-anchor="middle" fill="#81c784" font-size="10">User Mode</text>

  <!-- Ring 2 (mostly unused) -->
  <circle cx="250" cy="250" r="140" fill="none" stroke="#5c6370" stroke-width="1.5" stroke-dasharray="6,4"/>
  <circle cx="250" cy="250" r="140" fill="#5c6370" fill-opacity="0.03"/>
  <text x="250" y="124" text-anchor="middle" fill="#5c6370" font-size="11">Ring 2 (unused)</text>

  <!-- Ring 1 (mostly unused) -->
  <circle cx="250" cy="250" r="100" fill="none" stroke="#5c6370" stroke-width="1.5" stroke-dasharray="6,4"/>
  <circle cx="250" cy="250" r="100" fill="#5c6370" fill-opacity="0.03"/>
  <text x="250" y="164" text-anchor="middle" fill="#5c6370" font-size="11">Ring 1 (unused)</text>

  <!-- Ring 0 (innermost) -->
  <circle cx="250" cy="250" r="60" fill="#ef5350" fill-opacity="0.12" stroke="#ef5350" stroke-width="3"/>
  <text x="250" y="240" text-anchor="middle" fill="#ef5350" font-size="14" font-weight="bold">Ring 0</text>
  <text x="250" y="258" text-anchor="middle" fill="#ef5350" font-size="10">Kernel Mode</text>

  <!-- Ring 3 annotations (user mode) -->
  <text x="70" y="250" text-anchor="middle" fill="#81c784" font-size="9">Applications</text>
  <text x="70" y="264" text-anchor="middle" fill="#81c784" font-size="9">Libraries</text>

  <!-- Ring 0 capabilities annotation -->
  <rect x="320" y="310" width="160" height="80" rx="5" fill="#2a2a4a" stroke="#ef5350" stroke-width="1.5"/>
  <text x="400" y="328" text-anchor="middle" fill="#ef5350" font-size="10" font-weight="bold">Ring 0 can:</text>
  <text x="400" y="344" text-anchor="middle" fill="#e0e0e0" font-size="9">Access all memory</text>
  <text x="400" y="358" text-anchor="middle" fill="#e0e0e0" font-size="9">Execute any instruction</text>
  <text x="400" y="372" text-anchor="middle" fill="#e0e0e0" font-size="9">Control hardware directly</text>
  <text x="400" y="386" text-anchor="middle" fill="#e0e0e0" font-size="9">Modify page tables</text>
  <line x1="310" y1="290" x2="330" y2="320" stroke="#ef5350" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Ring 3 restrictions -->
  <rect x="20" y="310" width="160" height="70" rx="5" fill="#2a2a4a" stroke="#81c784" stroke-width="1.5"/>
  <text x="100" y="328" text-anchor="middle" fill="#81c784" font-size="10" font-weight="bold">Ring 3 cannot:</text>
  <text x="100" y="344" text-anchor="middle" fill="#e0e0e0" font-size="9">Use IN/OUT, CLI, STI</text>
  <text x="100" y="358" text-anchor="middle" fill="#e0e0e0" font-size="9">Access kernel memory</text>
  <text x="100" y="372" text-anchor="middle" fill="#e0e0e0" font-size="9">Modify control registers</text>
  <line x1="170" y1="350" x2="190" y2="340" stroke="#81c784" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Arrow showing transition -->
  <text x="250" y="440" text-anchor="middle" fill="#fff176" font-size="10">INT / SYSCALL transitions Ring 3 -> Ring 0</text>
  <text x="250" y="458" text-anchor="middle" fill="#fff176" font-size="10">IRET transitions Ring 0 -> Ring 3</text>

  <text x="250" y="486" text-anchor="middle" fill="#5c6370" font-size="9">Most modern OSes use only Ring 0 and Ring 3. Anton does the same.</text>
</svg>
