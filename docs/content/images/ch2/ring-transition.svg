<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" font-family="system-ui, -apple-system, sans-serif">
  <rect width="780" height="380" fill="#1a1a2e"/>

  <defs>
    <marker id="rt-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e0e0e0"/>
    </marker>
    <marker id="rt-arr-ret" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#81c784"/>
    </marker>
  </defs>

  <text x="390" y="24" text-anchor="middle" fill="#e0e0e0" font-size="14" font-weight="bold">Ring Transition: System Call via INT 0x80</text>

  <!-- User mode zone -->
  <rect x="20" y="45" width="160" height="300" rx="8" fill="#81c784" fill-opacity="0.06" stroke="#81c784" stroke-width="2"/>
  <text x="100" y="65" text-anchor="middle" fill="#81c784" font-size="12" font-weight="bold">Ring 3 (User)</text>

  <!-- Kernel mode zone -->
  <rect x="600" y="45" width="160" height="300" rx="8" fill="#ef5350" fill-opacity="0.06" stroke="#ef5350" stroke-width="2"/>
  <text x="680" y="65" text-anchor="middle" fill="#ef5350" font-size="12" font-weight="bold">Ring 0 (Kernel)</text>

  <!-- Step 1: User process -->
  <rect x="40" y="85" width="120" height="45" rx="5" fill="#1b2a3a" stroke="#81c784" stroke-width="2"/>
  <text x="100" y="105" text-anchor="middle" fill="#81c784" font-size="10" font-weight="bold">User Process</text>
  <text x="100" y="120" text-anchor="middle" fill="#e0e0e0" font-size="9">INT 0x80</text>
  <text x="40" y="80" fill="#fff176" font-size="10" font-weight="bold">1</text>

  <!-- Arrow to IDT -->
  <line x1="160" y1="107" x2="230" y2="107" stroke="#e0e0e0" stroke-width="2" marker-end="url(#rt-arr)"/>

  <!-- Step 2: CPU reads IDT -->
  <rect x="235" y="85" width="110" height="45" rx="5" fill="#1b2a3a" stroke="#4fc3f7" stroke-width="2"/>
  <text x="290" y="105" text-anchor="middle" fill="#4fc3f7" font-size="10" font-weight="bold">CPU reads IDT</text>
  <text x="290" y="120" text-anchor="middle" fill="#e0e0e0" font-size="9">vector 0x80</text>
  <text x="235" y="80" fill="#fff176" font-size="10" font-weight="bold">2</text>

  <!-- Arrow to TSS -->
  <line x1="345" y1="107" x2="390" y2="107" stroke="#e0e0e0" stroke-width="2" marker-end="url(#rt-arr)"/>

  <!-- Step 3: TSS stack switch -->
  <rect x="395" y="85" width="110" height="45" rx="5" fill="#1b2a3a" stroke="#ffb74d" stroke-width="2"/>
  <text x="450" y="105" text-anchor="middle" fill="#ffb74d" font-size="10" font-weight="bold">TSS Switch</text>
  <text x="450" y="120" text-anchor="middle" fill="#e0e0e0" font-size="9">load Ring 0 stack</text>
  <text x="395" y="80" fill="#fff176" font-size="10" font-weight="bold">3</text>

  <!-- Arrow down to save state -->
  <line x1="450" y1="130" x2="450" y2="160" stroke="#e0e0e0" stroke-width="2" marker-end="url(#rt-arr)"/>

  <!-- Step 4: CPU saves state on kernel stack -->
  <rect x="360" y="165" width="180" height="70" rx="5" fill="#1b2a3a" stroke="#ef5350" stroke-width="2"/>
  <text x="450" y="183" text-anchor="middle" fill="#ef5350" font-size="10" font-weight="bold">CPU pushes to</text>
  <text x="450" y="197" text-anchor="middle" fill="#ef5350" font-size="10" font-weight="bold">kernel stack:</text>
  <text x="450" y="215" text-anchor="middle" fill="#e0e0e0" font-size="9">SS, ESP, EFLAGS</text>
  <text x="450" y="228" text-anchor="middle" fill="#e0e0e0" font-size="9">CS, EIP</text>
  <text x="360" y="160" fill="#fff176" font-size="10" font-weight="bold">4</text>

  <!-- Arrow to handler -->
  <line x1="540" y1="200" x2="610" y2="200" stroke="#e0e0e0" stroke-width="2" marker-end="url(#rt-arr)"/>

  <!-- Step 5: Handler executes -->
  <rect x="620" y="180" width="120" height="45" rx="5" fill="#1b2a3a" stroke="#ef5350" stroke-width="2"/>
  <text x="680" y="200" text-anchor="middle" fill="#ef5350" font-size="10" font-weight="bold">ISR Handler</text>
  <text x="680" y="215" text-anchor="middle" fill="#e0e0e0" font-size="9">kernel code runs</text>
  <text x="620" y="175" fill="#fff176" font-size="10" font-weight="bold">5</text>

  <!-- Arrow to IRET -->
  <line x1="680" y1="225" x2="680" y2="260" stroke="#e0e0e0" stroke-width="2" marker-end="url(#rt-arr)"/>

  <!-- Step 6: IRET -->
  <rect x="620" y="265" width="120" height="45" rx="5" fill="#1b2a3a" stroke="#ce93d8" stroke-width="2"/>
  <text x="680" y="285" text-anchor="middle" fill="#ce93d8" font-size="10" font-weight="bold">IRET</text>
  <text x="680" y="300" text-anchor="middle" fill="#e0e0e0" font-size="9">restore state</text>
  <text x="620" y="260" fill="#fff176" font-size="10" font-weight="bold">6</text>

  <!-- Return arrow back to user -->
  <line x1="620" y1="287" x2="170" y2="287" stroke="#81c784" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#rt-arr-ret)"/>

  <!-- Step 7: Back to user -->
  <rect x="40" y="265" width="120" height="45" rx="5" fill="#1b2a3a" stroke="#81c784" stroke-width="2"/>
  <text x="100" y="285" text-anchor="middle" fill="#81c784" font-size="10" font-weight="bold">User Process</text>
  <text x="100" y="300" text-anchor="middle" fill="#e0e0e0" font-size="9">resumes</text>
  <text x="40" y="260" fill="#fff176" font-size="10" font-weight="bold">7</text>

  <text x="390" y="355" text-anchor="middle" fill="#fff176" font-size="10">The CPU enforces this gate mechanism in hardware. There is no shortcut.</text>
  <text x="390" y="373" text-anchor="middle" fill="#5c6370" font-size="9">This is how every system call works: user code asks the kernel to do something privileged on its behalf.</text>
</svg>
