<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" font-family="system-ui, -apple-system, sans-serif">
  <rect width="800" height="260" fill="#1a1a2e"/>

  <text x="400" y="24" text-anchor="middle" fill="#e0e0e0" font-size="14" font-weight="bold">The x86 Timeline</text>

  <!-- Timeline bar -->
  <line x1="60" y1="100" x2="740" y2="100" stroke="#3a3a5a" stroke-width="3"/>

  <!-- 8086 -->
  <circle cx="100" cy="100" r="8" fill="#ce93d8"/>
  <line x1="100" y1="92" x2="100" y2="55" stroke="#ce93d8" stroke-width="1.5"/>
  <text x="100" y="48" text-anchor="middle" fill="#ce93d8" font-size="13" font-weight="bold">8086</text>
  <text x="100" y="125" text-anchor="middle" fill="#e0e0e0" font-size="11">1978</text>
  <text x="100" y="142" text-anchor="middle" fill="#8e99a4" font-size="9">16-bit</text>
  <text x="100" y="155" text-anchor="middle" fill="#8e99a4" font-size="9">1 MB RAM</text>
  <text x="100" y="168" text-anchor="middle" fill="#8e99a4" font-size="9">Real Mode</text>

  <!-- 80286 -->
  <circle cx="240" cy="100" r="8" fill="#ce93d8"/>
  <line x1="240" y1="92" x2="240" y2="55" stroke="#ce93d8" stroke-width="1.5"/>
  <text x="240" y="48" text-anchor="middle" fill="#ce93d8" font-size="13" font-weight="bold">80286</text>
  <text x="240" y="125" text-anchor="middle" fill="#e0e0e0" font-size="11">1982</text>
  <text x="240" y="142" text-anchor="middle" fill="#8e99a4" font-size="9">16-bit</text>
  <text x="240" y="155" text-anchor="middle" fill="#8e99a4" font-size="9">16 MB RAM</text>
  <text x="240" y="168" text-anchor="middle" fill="#8e99a4" font-size="9">Protected Mode</text>

  <!-- 80386 -->
  <circle cx="380" cy="100" r="10" fill="#4fc3f7"/>
  <line x1="380" y1="90" x2="380" y2="55" stroke="#4fc3f7" stroke-width="1.5"/>
  <text x="380" y="48" text-anchor="middle" fill="#4fc3f7" font-size="13" font-weight="bold">80386</text>
  <text x="380" y="125" text-anchor="middle" fill="#e0e0e0" font-size="11">1985</text>
  <text x="380" y="142" text-anchor="middle" fill="#4fc3f7" font-size="9" font-weight="bold">32-bit</text>
  <text x="380" y="155" text-anchor="middle" fill="#4fc3f7" font-size="9">4 GB, Paging</text>
  <text x="380" y="168" text-anchor="middle" fill="#4fc3f7" font-size="9">Rings 0-3</text>
  <rect x="340" y="176" width="80" height="16" rx="3" fill="#1b2a3a" stroke="#4fc3f7" stroke-width="1"/>
  <text x="380" y="188" text-anchor="middle" fill="#4fc3f7" font-size="8">Anton starts here</text>

  <!-- Pentium -->
  <circle cx="520" cy="100" r="8" fill="#4fc3f7"/>
  <line x1="520" y1="92" x2="520" y2="55" stroke="#4fc3f7" stroke-width="1.5"/>
  <text x="520" y="48" text-anchor="middle" fill="#4fc3f7" font-size="13" font-weight="bold">Pentium</text>
  <text x="520" y="125" text-anchor="middle" fill="#e0e0e0" font-size="11">1993</text>
  <text x="520" y="142" text-anchor="middle" fill="#8e99a4" font-size="9">32-bit</text>
  <text x="520" y="155" text-anchor="middle" fill="#8e99a4" font-size="9">Superscalar</text>
  <text x="520" y="168" text-anchor="middle" fill="#8e99a4" font-size="9">Pipelining</text>

  <!-- x86-64 -->
  <circle cx="660" cy="100" r="10" fill="#81c784"/>
  <line x1="660" y1="90" x2="660" y2="55" stroke="#81c784" stroke-width="1.5"/>
  <text x="660" y="48" text-anchor="middle" fill="#81c784" font-size="13" font-weight="bold">x86-64</text>
  <text x="660" y="125" text-anchor="middle" fill="#e0e0e0" font-size="11">2003</text>
  <text x="660" y="142" text-anchor="middle" fill="#81c784" font-size="9" font-weight="bold">64-bit</text>
  <text x="660" y="155" text-anchor="middle" fill="#81c784" font-size="9">RAX, RBX...</text>
  <text x="660" y="168" text-anchor="middle" fill="#81c784" font-size="9">Long Mode</text>

  <!-- Legend -->
  <circle cx="200" cy="230" r="5" fill="#ce93d8"/>
  <text x="210" y="234" fill="#ce93d8" font-size="10">16-bit era</text>
  <circle cx="340" cy="230" r="5" fill="#4fc3f7"/>
  <text x="350" y="234" fill="#4fc3f7" font-size="10">32-bit era (IA-32)</text>
  <circle cx="510" cy="230" r="5" fill="#81c784"/>
  <text x="520" y="234" fill="#81c784" font-size="10">64-bit era (x86-64)</text>

  <text x="400" y="254" text-anchor="middle" fill="#5c6370" font-size="10">Every chip still boots in 16-bit real mode, just like the 8086.</text>
</svg>
