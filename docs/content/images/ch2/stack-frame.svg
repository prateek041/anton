<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 420" font-family="system-ui, -apple-system, sans-serif">
  <rect width="500" height="420" fill="#1a1a2e"/>

  <text x="250" y="24" text-anchor="middle" fill="#e0e0e0" font-size="14" font-weight="bold">Stack Frame Layout</text>
  <text x="250" y="42" text-anchor="middle" fill="#8e99a4" font-size="10">Growing downward (high addresses at top)</text>

  <!-- Address labels column -->
  <!-- Caller's frame region -->
  <text x="80" y="84" text-anchor="end" fill="#8e99a4" font-size="9">[EBP+12]</text>
  <rect x="90" y="70" width="240" height="28" rx="4" fill="#2a2a4a" stroke="#ffb74d" stroke-width="1.5"/>
  <text x="210" y="89" text-anchor="middle" fill="#ffb74d" font-size="11">Argument 2 (pushed first)</text>

  <text x="80" y="116" text-anchor="end" fill="#8e99a4" font-size="9">[EBP+8]</text>
  <rect x="90" y="102" width="240" height="28" rx="4" fill="#2a2a4a" stroke="#ffb74d" stroke-width="1.5"/>
  <text x="210" y="121" text-anchor="middle" fill="#ffb74d" font-size="11">Argument 1 (pushed second)</text>

  <!-- Return address -->
  <text x="80" y="148" text-anchor="end" fill="#8e99a4" font-size="9">[EBP+4]</text>
  <rect x="90" y="134" width="240" height="28" rx="4" fill="#2a2a4a" stroke="#ef5350" stroke-width="2"/>
  <text x="210" y="153" text-anchor="middle" fill="#ef5350" font-size="11" font-weight="bold">Return Address</text>

  <!-- Saved EBP -->
  <text x="80" y="180" text-anchor="end" fill="#8e99a4" font-size="9">[EBP+0]</text>
  <rect x="90" y="166" width="240" height="28" rx="4" fill="#1b2a3a" stroke="#4fc3f7" stroke-width="2"/>
  <text x="210" y="185" text-anchor="middle" fill="#4fc3f7" font-size="11" font-weight="bold">Saved EBP (caller's)</text>

  <!-- EBP pointer arrow -->
  <line x1="340" y1="180" x2="420" y2="180" stroke="#4fc3f7" stroke-width="2"/>
  <text x="430" y="184" fill="#4fc3f7" font-size="11" font-weight="bold">&#x2190; EBP</text>

  <!-- Local var 1 -->
  <text x="80" y="212" text-anchor="end" fill="#8e99a4" font-size="9">[EBP-4]</text>
  <rect x="90" y="198" width="240" height="28" rx="4" fill="#1b2a3a" stroke="#81c784" stroke-width="1.5"/>
  <text x="210" y="217" text-anchor="middle" fill="#81c784" font-size="11">Local Variable 1</text>

  <!-- Local var 2 -->
  <text x="80" y="244" text-anchor="end" fill="#8e99a4" font-size="9">[EBP-8]</text>
  <rect x="90" y="230" width="240" height="28" rx="4" fill="#1b2a3a" stroke="#81c784" stroke-width="1.5"/>
  <text x="210" y="249" text-anchor="middle" fill="#81c784" font-size="11">Local Variable 2</text>

  <!-- Local var 3 -->
  <text x="80" y="276" text-anchor="end" fill="#8e99a4" font-size="9">[EBP-12]</text>
  <rect x="90" y="262" width="240" height="28" rx="4" fill="#1b2a3a" stroke="#81c784" stroke-width="1.5"/>
  <text x="210" y="281" text-anchor="middle" fill="#81c784" font-size="11">Local Variable 3</text>

  <!-- ESP pointer arrow -->
  <line x1="340" y1="276" x2="420" y2="276" stroke="#ef5350" stroke-width="2"/>
  <text x="430" y="280" fill="#ef5350" font-size="11" font-weight="bold">&#x2190; ESP</text>

  <!-- Frame bracket -->
  <line x1="350" y1="166" x2="350" y2="290" stroke="#fff176" stroke-width="1.5"/>
  <line x1="345" y1="166" x2="350" y2="166" stroke="#fff176" stroke-width="1.5"/>
  <line x1="345" y1="290" x2="350" y2="290" stroke="#fff176" stroke-width="1.5"/>
  <text x="360" y="232" fill="#fff176" font-size="9" transform="rotate(90, 360, 232)">Current frame</text>

  <!-- Legend -->
  <rect x="60" y="320" width="12" height="12" rx="2" fill="#ffb74d" opacity="0.4"/>
  <text x="80" y="330" fill="#ffb74d" font-size="10">Arguments (caller pushes)</text>

  <rect x="60" y="340" width="12" height="12" rx="2" fill="#ef5350" opacity="0.4"/>
  <text x="80" y="350" fill="#ef5350" font-size="10">Return address (CALL pushes)</text>

  <rect x="60" y="360" width="12" height="12" rx="2" fill="#4fc3f7" opacity="0.4"/>
  <text x="80" y="370" fill="#4fc3f7" font-size="10">Saved frame pointer (callee prologue)</text>

  <rect x="60" y="380" width="12" height="12" rx="2" fill="#81c784" opacity="0.4"/>
  <text x="80" y="390" fill="#81c784" font-size="10">Local variables (SUB ESP, N)</text>

  <text x="250" y="412" text-anchor="middle" fill="#5c6370" font-size="9">EBP is a stable anchor. Arguments at positive offsets, locals at negative offsets.</text>
</svg>
