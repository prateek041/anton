<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" font-family="system-ui, -apple-system, sans-serif">
  <rect width="600" height="380" fill="#1a1a2e"/>

  <text x="300" y="24" text-anchor="middle" fill="#e0e0e0" font-size="14" font-weight="bold">x86 General-Purpose Registers (32-bit)</text>

  <!-- Column headers -->
  <text x="100" y="54" text-anchor="middle" fill="#8e99a4" font-size="10">Register</text>
  <text x="300" y="54" text-anchor="middle" fill="#8e99a4" font-size="10">32 bits</text>
  <text x="520" y="54" text-anchor="middle" fill="#8e99a4" font-size="10">Conventional Use</text>

  <!-- EAX -->
  <rect x="30" y="64" width="360" height="30" rx="4" fill="#1b2a3a" stroke="#4fc3f7" stroke-width="2"/>
  <text x="56" y="84" fill="#4fc3f7" font-size="13" font-weight="bold">EAX</text>
  <text x="520" y="84" text-anchor="middle" fill="#e0e0e0" font-size="11">Accumulator (return value)</text>

  <!-- EBX -->
  <rect x="30" y="100" width="360" height="30" rx="4" fill="#1b2a3a" stroke="#4fc3f7" stroke-width="2"/>
  <text x="56" y="120" fill="#4fc3f7" font-size="13" font-weight="bold">EBX</text>
  <text x="520" y="120" text-anchor="middle" fill="#e0e0e0" font-size="11">Base (general purpose)</text>

  <!-- ECX -->
  <rect x="30" y="136" width="360" height="30" rx="4" fill="#1b2a3a" stroke="#4fc3f7" stroke-width="2"/>
  <text x="56" y="156" fill="#4fc3f7" font-size="13" font-weight="bold">ECX</text>
  <text x="520" y="156" text-anchor="middle" fill="#e0e0e0" font-size="11">Counter (loops, shifts)</text>

  <!-- EDX -->
  <rect x="30" y="172" width="360" height="30" rx="4" fill="#1b2a3a" stroke="#4fc3f7" stroke-width="2"/>
  <text x="56" y="192" fill="#4fc3f7" font-size="13" font-weight="bold">EDX</text>
  <text x="520" y="192" text-anchor="middle" fill="#e0e0e0" font-size="11">Data (I/O, multiply ext.)</text>

  <!-- ESI -->
  <rect x="30" y="214" width="360" height="30" rx="4" fill="#1b2a3a" stroke="#ffb74d" stroke-width="2"/>
  <text x="56" y="234" fill="#ffb74d" font-size="13" font-weight="bold">ESI</text>
  <text x="520" y="234" text-anchor="middle" fill="#e0e0e0" font-size="11">Source Index (string src)</text>

  <!-- EDI -->
  <rect x="30" y="250" width="360" height="30" rx="4" fill="#1b2a3a" stroke="#ffb74d" stroke-width="2"/>
  <text x="56" y="270" fill="#ffb74d" font-size="13" font-weight="bold">EDI</text>
  <text x="520" y="270" text-anchor="middle" fill="#e0e0e0" font-size="11">Destination Index (string dst)</text>

  <!-- ESP -->
  <rect x="30" y="292" width="360" height="30" rx="4" fill="#1b2a3a" stroke="#ef5350" stroke-width="2"/>
  <text x="56" y="312" fill="#ef5350" font-size="13" font-weight="bold">ESP</text>
  <text x="520" y="312" text-anchor="middle" fill="#e0e0e0" font-size="11">Stack Pointer (top of stack)</text>

  <!-- EBP -->
  <rect x="30" y="328" width="360" height="30" rx="4" fill="#1b2a3a" stroke="#ef5350" stroke-width="2"/>
  <text x="56" y="348" fill="#ef5350" font-size="13" font-weight="bold">EBP</text>
  <text x="520" y="348" text-anchor="middle" fill="#e0e0e0" font-size="11">Base Pointer (stack frame)</text>

  <!-- Legend -->
  <rect x="100" y="368" width="10" height="4" fill="#4fc3f7"/>
  <text x="116" y="372" fill="#4fc3f7" font-size="9">Computation</text>
  <rect x="220" y="368" width="10" height="4" fill="#ffb74d"/>
  <text x="236" y="372" fill="#ffb74d" font-size="9">Index / Pointer</text>
  <rect x="360" y="368" width="10" height="4" fill="#ef5350"/>
  <text x="376" y="372" fill="#ef5350" font-size="9">Stack</text>
</svg>
