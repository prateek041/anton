<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 240" font-family="system-ui, -apple-system, sans-serif">
  <rect width="750" height="240" fill="#1a1a2e"/>

  <text x="375" y="24" text-anchor="middle" fill="#e0e0e0" font-size="14" font-weight="bold">EFLAGS Register (32-bit)</text>

  <!-- Main register bar -->
  <rect x="25" y="45" width="700" height="44" rx="5" fill="#1b2a3a" stroke="#4fc3f7" stroke-width="2"/>

  <!-- Bit position markers along top -->
  <text x="40" y="42" fill="#8e99a4" font-size="7">31</text>
  <text x="195" y="42" fill="#8e99a4" font-size="7">21</text>
  <text x="260" y="42" fill="#8e99a4" font-size="7">16</text>
  <text x="345" y="42" fill="#8e99a4" font-size="7">12</text>
  <text x="410" y="42" fill="#8e99a4" font-size="7">9</text>
  <text x="470" y="42" fill="#8e99a4" font-size="7">7</text>
  <text x="540" y="42" fill="#8e99a4" font-size="7">6</text>
  <text x="630" y="42" fill="#8e99a4" font-size="7">2</text>
  <text x="710" y="42" fill="#8e99a4" font-size="7">0</text>

  <!-- Individual flag bits inside the register bar -->
  <!-- ID (21) -->
  <rect x="195" y="52" width="30" height="28" rx="2" fill="#2a2a4a" stroke="#ce93d8" stroke-width="1"/>
  <text x="210" y="70" text-anchor="middle" fill="#ce93d8" font-size="9" font-weight="bold">ID</text>

  <!-- WP: not a flag. Let me replace with IOPL (12-13) and other key ones -->
  <!-- IOPL (12-13) -->
  <rect x="340" y="52" width="50" height="28" rx="2" fill="#2a2a4a" stroke="#ef5350" stroke-width="1.5"/>
  <text x="365" y="70" text-anchor="middle" fill="#ef5350" font-size="9" font-weight="bold">IOPL</text>

  <!-- OF (11) -->
  <rect x="395" y="52" width="30" height="28" rx="2" fill="#2a2a4a" stroke="#4fc3f7" stroke-width="1.5"/>
  <text x="410" y="70" text-anchor="middle" fill="#4fc3f7" font-size="9" font-weight="bold">OF</text>

  <!-- DF (10) -->
  <rect x="430" y="52" width="30" height="28" rx="2" fill="#2a2a4a" stroke="#ffb74d" stroke-width="1.5"/>
  <text x="445" y="70" text-anchor="middle" fill="#ffb74d" font-size="9" font-weight="bold">DF</text>

  <!-- IF (9) -->
  <rect x="465" y="52" width="30" height="28" rx="2" fill="#2a2a4a" stroke="#ef5350" stroke-width="1.5"/>
  <text x="480" y="70" text-anchor="middle" fill="#ef5350" font-size="9" font-weight="bold">IF</text>

  <!-- SF (7) -->
  <rect x="510" y="52" width="30" height="28" rx="2" fill="#2a2a4a" stroke="#4fc3f7" stroke-width="1.5"/>
  <text x="525" y="70" text-anchor="middle" fill="#4fc3f7" font-size="9" font-weight="bold">SF</text>

  <!-- ZF (6) -->
  <rect x="545" y="52" width="30" height="28" rx="2" fill="#2a2a4a" stroke="#4fc3f7" stroke-width="1.5"/>
  <text x="560" y="70" text-anchor="middle" fill="#4fc3f7" font-size="9" font-weight="bold">ZF</text>

  <!-- AF (4) -->
  <rect x="590" y="52" width="30" height="28" rx="2" fill="#2a2a4a" stroke="#4fc3f7" stroke-width="1.5"/>
  <text x="605" y="70" text-anchor="middle" fill="#4fc3f7" font-size="9" font-weight="bold">AF</text>

  <!-- PF (2) -->
  <rect x="630" y="52" width="30" height="28" rx="2" fill="#2a2a4a" stroke="#4fc3f7" stroke-width="1.5"/>
  <text x="645" y="70" text-anchor="middle" fill="#4fc3f7" font-size="9" font-weight="bold">PF</text>

  <!-- CF (0) -->
  <rect x="680" y="52" width="30" height="28" rx="2" fill="#2a2a4a" stroke="#4fc3f7" stroke-width="1.5"/>
  <text x="695" y="70" text-anchor="middle" fill="#4fc3f7" font-size="9" font-weight="bold">CF</text>

  <!-- Annotations with lines -->
  <!-- Status flags -->
  <rect x="30" y="115" width="250" height="80" rx="6" fill="#1b2a3a" stroke="#4fc3f7" stroke-width="1.5"/>
  <text x="155" y="135" text-anchor="middle" fill="#4fc3f7" font-size="12" font-weight="bold">Status Flags</text>
  <text x="45" y="153" fill="#e0e0e0" font-size="10">CF (0) - Carry / unsigned overflow</text>
  <text x="45" y="167" fill="#e0e0e0" font-size="10">ZF (6) - Zero result</text>
  <text x="45" y="181" fill="#e0e0e0" font-size="10">SF (7) - Sign bit of result</text>
  <text x="45" y="195" fill="#e0e0e0" font-size="10">OF (11) - Signed overflow</text>

  <!-- Control flags -->
  <rect x="300" y="115" width="170" height="60" rx="6" fill="#1b2a3a" stroke="#ffb74d" stroke-width="1.5"/>
  <text x="385" y="135" text-anchor="middle" fill="#ffb74d" font-size="12" font-weight="bold">Control Flags</text>
  <text x="315" y="153" fill="#e0e0e0" font-size="10">DF (10) - Direction</text>
  <text x="315" y="167" fill="#e0e0e0" font-size="10">(string op direction)</text>

  <!-- System flags -->
  <rect x="490" y="115" width="230" height="80" rx="6" fill="#1b2a3a" stroke="#ef5350" stroke-width="1.5"/>
  <text x="605" y="135" text-anchor="middle" fill="#ef5350" font-size="12" font-weight="bold">System Flags</text>
  <text x="505" y="153" fill="#e0e0e0" font-size="10">IF (9) - Interrupt enable</text>
  <text x="505" y="167" fill="#e0e0e0" font-size="10">IOPL (12-13) - I/O privilege level</text>
  <text x="505" y="181" fill="#e0e0e0" font-size="10">ID (21) - CPUID supported</text>

  <text x="375" y="230" text-anchor="middle" fill="#5c6370" font-size="10">Most arithmetic instructions automatically update the status flags.</text>
</svg>
