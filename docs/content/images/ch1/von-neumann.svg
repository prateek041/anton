<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="system-ui, -apple-system, sans-serif">
  <rect width="720" height="400" fill="#1a1a2e"/>

  <!-- CPU -->
  <rect x="280" y="30" width="160" height="80" rx="10" fill="#1a1a2e" stroke="#4fc3f7" stroke-width="2.5"/>
  <text x="360" y="62" text-anchor="middle" fill="#4fc3f7" font-size="14" font-weight="bold">CPU</text>
  <text x="360" y="82" text-anchor="middle" fill="#8e99a4" font-size="11">Central Processing Unit</text>

  <!-- Memory -->
  <rect x="40" y="180" width="160" height="80" rx="10" fill="#1a1a2e" stroke="#81c784" stroke-width="2.5"/>
  <text x="120" y="212" text-anchor="middle" fill="#81c784" font-size="14" font-weight="bold">Memory</text>
  <text x="120" y="232" text-anchor="middle" fill="#8e99a4" font-size="11">Instructions + Data</text>

  <!-- I/O Input -->
  <rect x="520" y="140" width="160" height="70" rx="10" fill="#1a1a2e" stroke="#ffb74d" stroke-width="2.5"/>
  <text x="600" y="170" text-anchor="middle" fill="#ffb74d" font-size="14" font-weight="bold">I/O Input</text>
  <text x="600" y="188" text-anchor="middle" fill="#8e99a4" font-size="11">Keyboard, Disk</text>

  <!-- I/O Output -->
  <rect x="520" y="230" width="160" height="70" rx="10" fill="#1a1a2e" stroke="#ffb74d" stroke-width="2.5"/>
  <text x="600" y="260" text-anchor="middle" fill="#ffb74d" font-size="14" font-weight="bold">I/O Output</text>
  <text x="600" y="278" text-anchor="middle" fill="#8e99a4" font-size="11">Screen, Speaker</text>

  <!-- System Bus bar -->
  <rect x="60" y="320" width="600" height="36" rx="6" fill="#2a1a1a" stroke="#ef5350" stroke-width="2"/>
  <text x="360" y="343" text-anchor="middle" fill="#ef5350" font-size="13" font-weight="bold">System Bus</text>
  <text x="360" y="370" text-anchor="middle" fill="#8e99a4" font-size="10">(Address Bus + Data Bus + Control Bus)</text>

  <!-- Connectors: CPU to Bus -->
  <line x1="360" y1="110" x2="360" y2="320" stroke="#e0e0e0" stroke-width="2" stroke-dasharray="6,3"/>
  <polygon points="355,316 365,316 360,324" fill="#e0e0e0"/>
  <polygon points="355,114 365,114 360,110" fill="#e0e0e0"/>

  <!-- Memory to Bus -->
  <line x1="120" y1="260" x2="120" y2="320" stroke="#e0e0e0" stroke-width="2" stroke-dasharray="6,3"/>
  <polygon points="115,316 125,316 120,324" fill="#e0e0e0"/>
  <polygon points="115,264 125,264 120,260" fill="#e0e0e0"/>

  <!-- I/O Input to Bus -->
  <line x1="600" y1="210" x2="600" y2="320" stroke="#e0e0e0" stroke-width="2" stroke-dasharray="6,3"/>
  <polygon points="595,316 605,316 600,324" fill="#e0e0e0"/>
  <polygon points="595,214 605,214 600,210" fill="#e0e0e0"/>

  <!-- I/O Output to Bus (short) -->
  <line x1="600" y1="300" x2="600" y2="320" stroke="#e0e0e0" stroke-width="2" stroke-dasharray="6,3"/>
  <polygon points="595,316 605,316 600,324" fill="#e0e0e0"/>
  <polygon points="595,304 605,304 600,300" fill="#e0e0e0"/>

  <!-- Title -->
  <text x="360" y="395" text-anchor="middle" fill="#5c6370" font-size="11">Von Neumann Architecture</text>
</svg>
