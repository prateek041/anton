<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 380" font-family="system-ui, -apple-system, sans-serif">
  <rect width="460" height="380" fill="#1a1a2e"/>

  <text x="230" y="24" text-anchor="middle" fill="#e0e0e0" font-size="14" font-weight="bold">Memory as a Byte Array</text>

  <defs>
    <marker id="ma-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ef5350"/>
    </marker>
  </defs>

  <!-- Address column header -->
  <text x="100" y="52" text-anchor="middle" fill="#8e99a4" font-size="11" font-weight="bold">Address</text>
  <text x="230" y="52" text-anchor="middle" fill="#8e99a4" font-size="11" font-weight="bold">Value (1 byte)</text>

  <!-- Row 0 -->
  <text x="100" y="80" text-anchor="middle" fill="#e0e0e0" font-size="12" font-family="monospace">0x0000</text>
  <rect x="170" y="64" width="120" height="28" rx="4" fill="#1a2e1a" stroke="#81c784" stroke-width="1.5"/>
  <text x="230" y="83" text-anchor="middle" fill="#81c784" font-size="12" font-family="monospace">0x4D</text>

  <!-- Row 1 -->
  <text x="100" y="112" text-anchor="middle" fill="#e0e0e0" font-size="12" font-family="monospace">0x0001</text>
  <rect x="170" y="96" width="120" height="28" rx="4" fill="#1a2e1a" stroke="#81c784" stroke-width="1.5"/>
  <text x="230" y="115" text-anchor="middle" fill="#81c784" font-size="12" font-family="monospace">0x6F</text>

  <!-- Row 2 -->
  <text x="100" y="144" text-anchor="middle" fill="#e0e0e0" font-size="12" font-family="monospace">0x0002</text>
  <rect x="170" y="128" width="120" height="28" rx="4" fill="#1a2e1a" stroke="#81c784" stroke-width="1.5"/>
  <text x="230" y="147" text-anchor="middle" fill="#81c784" font-size="12" font-family="monospace">0x76</text>

  <!-- Row 3 (highlighted - CPU is reading this one) -->
  <text x="100" y="176" text-anchor="middle" fill="#e0e0e0" font-size="12" font-family="monospace">0x0003</text>
  <rect x="170" y="160" width="120" height="28" rx="4" fill="#2e2a1a" stroke="#fff176" stroke-width="2.5"/>
  <text x="230" y="179" text-anchor="middle" fill="#fff176" font-size="12" font-family="monospace" font-weight="bold">0xB8</text>

  <!-- Row 4 -->
  <text x="100" y="208" text-anchor="middle" fill="#e0e0e0" font-size="12" font-family="monospace">0x0004</text>
  <rect x="170" y="192" width="120" height="28" rx="4" fill="#1a2e1a" stroke="#81c784" stroke-width="1.5"/>
  <text x="230" y="211" text-anchor="middle" fill="#81c784" font-size="12" font-family="monospace">0x05</text>

  <!-- Row 5 -->
  <text x="100" y="240" text-anchor="middle" fill="#e0e0e0" font-size="12" font-family="monospace">0x0005</text>
  <rect x="170" y="224" width="120" height="28" rx="4" fill="#1a2e1a" stroke="#81c784" stroke-width="1.5"/>
  <text x="230" y="243" text-anchor="middle" fill="#81c784" font-size="12" font-family="monospace">0x00</text>

  <!-- Row 6 -->
  <text x="100" y="272" text-anchor="middle" fill="#e0e0e0" font-size="12" font-family="monospace">0x0006</text>
  <rect x="170" y="256" width="120" height="28" rx="4" fill="#1a2e1a" stroke="#81c784" stroke-width="1.5"/>
  <text x="230" y="275" text-anchor="middle" fill="#81c784" font-size="12" font-family="monospace">0xFF</text>

  <!-- Ellipsis -->
  <text x="230" y="305" text-anchor="middle" fill="#5c6370" font-size="16">...</text>

  <!-- CPU arrow pointing to row 3 -->
  <rect x="340" y="156" width="70" height="36" rx="6" fill="#1a1a2e" stroke="#ef5350" stroke-width="2"/>
  <text x="375" y="179" text-anchor="middle" fill="#ef5350" font-size="12" font-weight="bold">CPU</text>
  <line x1="340" y1="174" x2="295" y2="174" stroke="#ef5350" stroke-width="2" marker-end="url(#ma-arr)"/>
  <text x="350" y="210" fill="#ef5350" font-size="9">"Read address</text>
  <text x="350" y="222" fill="#ef5350" font-size="9"> 0x0003"</text>

  <!-- Caption -->
  <text x="230" y="338" text-anchor="middle" fill="#8e99a4" font-size="11">Each cell is one byte (8 bits).</text>
  <text x="230" y="354" text-anchor="middle" fill="#8e99a4" font-size="11">The address is just an index into this array.</text>
</svg>
